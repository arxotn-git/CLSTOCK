<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>CL 시스템 재고 관리 (v52)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-down { animation: slideDown 0.3s ease-out forwards; }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>

    <script>
        Babel.registerPreset('react-classic', {
            presets: [
                [Babel.availablePresets.react, { runtime: 'classic' }]
            ]
        });
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react-classic">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(() => {
                return localStorage.getItem('inventory_auth_pin') === 'true';
            });
            const [pin, setPin] = useState("");
            const [errorMsg, setErrorMsg] = useState("");
            
            const [firebaseUser, setFirebaseUser] = useState(null);
            const [firebaseRefs, setFirebaseRefs] = useState(null);
            const [histories, setHistories] = useState([]);
            const [selectedHistoryId, setSelectedHistoryId] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            
            const [serverStatus, setServerStatus] = useState("connecting"); 
            const [toastMessage, setToastMessage] = useState("");
            
            const [showWarningOnly, setShowWarningOnly] = useState(false);
            const [searchKeyword, setSearchKeyword] = useState("");
            const [viewMode, setViewMode] = useState("period"); 
            const [selectedPeriod, setSelectedPeriod] = useState(30);
            
            const [customStartDate, setCustomStartDate] = useState("");
            const [customEndDate, setCustomEndDate] = useState("");

            // v52: 탭 구조 (총재고 / CL 시스템 / 위킵) + 위킵 데이터 상태
            const [activeTab, setActiveTab] = useState("total");
            const [wkHistories, setWkHistories] = useState([]);
            const [wkSelectedHistoryId, setWkSelectedHistoryId] = useState(null);
            const [wkIsUploading, setWkIsUploading] = useState(false);
            const [wkSearchKeyword, setWkSearchKeyword] = useState("");
            const [totalSearchKeyword, setTotalSearchKeyword] = useState("");

            useEffect(() => {
                const handleOnline = () => setServerStatus("connected");
                const handleOffline = () => setServerStatus("disconnected");
                window.addEventListener("online", handleOnline);
                window.addEventListener("offline", handleOffline);
                return () => {
                    window.removeEventListener("online", handleOnline);
                    window.removeEventListener("offline", handleOffline);
                }
            }, []);

            useEffect(() => {
                if (toastMessage) {
                    const timer = setTimeout(() => setToastMessage(""), 3500);
                    return () => clearTimeout(timer);
                }
            }, [toastMessage]);

            useEffect(() => {
                let isMounted = true;
                const initFirebase = async () => {
                    try {
                        const firebaseConfig = {
                            apiKey: "AIzaSyBoJ8xKhYkr1hyTOJlRaPwGFjVoZIuK9Sw",
                            authDomain: "clstpock.firebaseapp.com",
                            projectId: "clstpock",
                            storageBucket: "clstpock.firebasestorage.app",
                            messagingSenderId: "14396365208",
                            appId: "1:14396365208:web:89625d54c26868e06533ed",
                            measurementId: "G-ZFWM8LBF12"
                        };

                        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                        const { getAuth, signInAnonymously, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                        const { getFirestore, collection, onSnapshot, addDoc, doc, deleteDoc, getDocs } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        const appId = 'inventory-tracker-01'; 

                        if (isMounted) {
                            setFirebaseRefs({ db, appId, collection, onSnapshot, addDoc, doc, deleteDoc, getDocs });
                        }

                        await signInAnonymously(auth);
                        
                        onAuthStateChanged(auth, (user) => {
                            if (isMounted) {
                                setFirebaseUser(user);
                                setServerStatus("connected");
                            }
                        });
                    } catch (err) {
                        console.error("Firebase init error:", err);
                        if (isMounted) setServerStatus("disconnected");
                    }
                };
                initFirebase();
                return () => { isMounted = false; };
            }, []);

            useEffect(() => {
                if (!firebaseUser || !firebaseRefs) return;

                const { db, appId, collection, onSnapshot } = firebaseRefs;
                const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'inventory_history');

                const unsubscribe = onSnapshot(collRef, (snapshot) => {
                    const data = [];
                    snapshot.forEach((doc) => {
                        data.push({ id: doc.id, ...doc.data() });
                    });
                    
                    data.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    
                    setHistories(data);
                    
                    if (data.length > 0) {
                        if (!selectedHistoryId || !data.find(h => h.id === selectedHistoryId)) {
                            setSelectedHistoryId(data[0].id);
                        }
                    } else {
                        setSelectedHistoryId(null);
                    }
                }, (error) => {
                    console.error("Fetch error:", error);
                    setServerStatus("disconnected");
                });

                return () => unsubscribe();
            }, [firebaseUser, selectedHistoryId, firebaseRefs]);

            // v52: 위킵(FBW) 재고 컬렉션 실시간 동기화
            useEffect(() => {
                if (!firebaseUser || !firebaseRefs) return;

                const { db, appId, collection, onSnapshot } = firebaseRefs;
                const wkCollRef = collection(db, 'artifacts', appId, 'public', 'data', 'weekeep_inventory');

                const unsubscribe = onSnapshot(wkCollRef, (snapshot) => {
                    const data = [];
                    snapshot.forEach((doc) => {
                        data.push({ id: doc.id, ...doc.data() });
                    });

                    data.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

                    setWkHistories(data);

                    if (data.length > 0) {
                        if (!wkSelectedHistoryId || !data.find(h => h.id === wkSelectedHistoryId)) {
                            setWkSelectedHistoryId(data[0].id);
                        }
                    } else {
                        setWkSelectedHistoryId(null);
                    }
                }, (error) => {
                    console.error("Weekeep Fetch error:", error);
                });

                return () => unsubscribe();
            }, [firebaseUser, wkSelectedHistoryId, firebaseRefs]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (pin === "0501") {
                    setIsAuthenticated(true);
                    localStorage.setItem('inventory_auth_pin', 'true');
                } else {
                    setErrorMsg("비밀번호가 일치하지 않습니다.");
                    setPin("");
                }
            };

            const handleResetDB = async () => {
                if (!firebaseRefs) return;
                const isConfirmed = window.confirm("🚨 경고: 클라우드에 저장된 모든 과거 재고/출고 히스토리를 완전히 삭제하고 초기화합니다.\n(유령 데이터나 꼬인 수량을 해결할 때 사용합니다.)\n\n정말 초기화 하시겠습니까?");
                if (!isConfirmed) return;

                try {
                    const { db, appId, collection, getDocs, deleteDoc } = firebaseRefs;
                    const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'inventory_history');
                    const snapshot = await getDocs(collRef);
                    
                    const deletePromises = [];
                    snapshot.forEach(docSnap => {
                        deletePromises.push(deleteDoc(docSnap.ref));
                    });
                    await Promise.all(deletePromises);
                    
                    setToastMessage("클라우드 DB가 완벽하게 초기화되었습니다. 엑셀을 새로 업로드해 주세요.");
                } catch (error) {
                    console.error("DB Reset error:", error);
                    alert("초기화 중 오류가 발생했습니다.");
                }
            };

            const handleCleanDateRange = async () => {
                if (!firebaseRefs || !currentData) return;
                const startStr = window.prompt(
                    "삭제할 구간 시작일 (YYYY-MM-DD)\n예: 2026-06-20\n\n→ 해당 구간의 daily 데이터를 모두 0으로 초기화하고\n   out_7/15/30 을 재계산합니다.",
                    "2026-06-20"
                );
                if (!startStr) return;
                const endStr = window.prompt("삭제할 구간 종료일 (YYYY-MM-DD)", startStr);
                if (!endStr) return;

                const [sy, sm, sd] = startStr.split('-');
                const [ey, em, ed] = endStr.split('-');
                const minTime = new Date(sy, sm - 1, sd, 0, 0, 0).getTime();
                const maxTime = new Date(ey, em - 1, ed, 23, 59, 59).getTime();

                if (isNaN(minTime) || isNaN(maxTime) || minTime > maxTime) {
                    alert("날짜 형식이 잘못되었습니다.");
                    return;
                }

                const base = currentData.baseDate;
                const baseD = new Date(base);
                const t30 = new Date(baseD.getFullYear(), baseD.getMonth(), baseD.getDate() - 29, 0, 0, 0).getTime();
                const t15 = new Date(baseD.getFullYear(), baseD.getMonth(), baseD.getDate() - 14, 0, 0, 0).getTime();
                const t7  = new Date(baseD.getFullYear(), baseD.getMonth(), baseD.getDate() - 6,  0, 0, 0).getTime();

                const cleanedItems = currentData.items.map(item => {
                    const daily = { ...(item.daily || {}) };
                    Object.keys(daily).forEach(dKey => {
                        const [y, m, d] = dKey.split('-');
                        const dt = new Date(y, m - 1, d, 12, 0, 0).getTime();
                        if (dt >= minTime && dt <= maxTime) delete daily[dKey];
                    });

                    let s30 = 0, s15 = 0, s7 = 0;
                    Object.entries(daily).forEach(([dKey, amt]) => {
                        const [y, m, d] = dKey.split('-');
                        const dt = new Date(y, m - 1, d, 12, 0, 0).getTime();
                        if (dt >= t30 && dt <= base) s30 += amt;
                        if (dt >= t15 && dt <= base) s15 += amt;
                        if (dt >= t7  && dt <= base) s7  += amt;
                    });

                    return { ...item, daily, out_30: s30, out_15: s15, out_7: s7 };
                });

                try {
                    const { db, appId, collection, getDocs, deleteDoc, addDoc } = firebaseRefs;
                    const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'inventory_history');
                    const newDoc = await addDoc(collRef, {
                        ...currentData,
                        id: undefined,
                        createdAt: new Date().toISOString(),
                        version: `V${histories.length + 1}_cleaned`,
                        items: cleanedItems
                    });
                    setSelectedHistoryId(newDoc.id);
                    setToastMessage(`✅ ${startStr} ~ ${endStr} 구간 ghost 제거 완료 / out_7/15/30 재계산됨`);
                } catch (err) {
                    console.error(err);
                    alert("저장 실패: " + err.message);
                }
            };

            const parseExcelDate = (val) => {
                if (!val) return null;
                if (val instanceof Date) {
                    return new Date(val.getUTCFullYear(), val.getUTCMonth(), val.getUTCDate(), val.getUTCHours(), val.getUTCMinutes(), val.getUTCSeconds());
                }
                if (typeof val === 'number') {
                    const days = Math.floor(val);
                    const fractionalDay = val - days;
                    const ms = Math.round(fractionalDay * 86400 * 1000);
                    const d = new Date((days - 25569) * 86400 * 1000);
                    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 
                                    Math.floor(ms / 3600000), 
                                    Math.floor((ms % 3600000) / 60000), 
                                    Math.floor((ms % 60000) / 1000));
                }
                const str = String(val).trim();
                const match = str.match(/(\d{4})[\-\/\.](\d{1,2})[\-\/\.](\d{1,2})(?:\s+(\d{1,2}):(\d{1,2}):(\d{1,2}))?/);
                if (match) {
                    return new Date(parseInt(match[1]), parseInt(match[2])-1, parseInt(match[3]), 
                                    match[4] ? parseInt(match[4]) : 0, 
                                    match[5] ? parseInt(match[5]) : 0, 
                                    match[6] ? parseInt(match[6]) : 0);
                }
                const d = new Date(str.replace(" ", "T"));
                if (!isNaN(d.getTime())) return d;
                return null;
            };

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setIsUploading(true);

                try {
                    let rawStock = [];
                    let rawOutbound = [];
                    let isStockFile = false;
                    let isOutboundFile = false;
                    let hasParsedStockHeader = false;
                    let hasParsedOutboundHeader = false;

                    const fileReads = files.map(file => {
                        return new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = (evt) => resolve({ file, data: evt.target.result });
                            reader.onerror = reject;
                            reader.readAsBinaryString(file);
                        });
                    });

                    const results = await Promise.all(fileReads);

                    for (const result of results) {
                        const { file, data: fileString } = result;
                        let wb;
                        
                        if (fileString.includes('<table') || fileString.includes('<TABLE') || fileString.includes('<?xml')) {
                            console.warn(`[${file.name}] HTML/XML 기반 가짜 엑셀 감지. 자체 스크래핑 가동...`);
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(fileString, 'text/html');
                            const table = doc.querySelector('table');
                            
                            if (!table) {
                                throw new Error(`[${file.name}] 문서 내에서 표(Table)를 찾을 수 없습니다.`);
                            }
                            wb = XLSX.utils.table_to_book(table, { raw: true, cellDates: true });
                        } else {
                            wb = XLSX.read(fileString, { type: 'binary', cellDates: true });
                        }

                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const sheetData = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
                        const headerRow = sheetData[0] || [];
                        
                        const hasStockKeywords = headerRow.some(k => typeof k === 'string' && (k.includes('현재고') || k.includes('가용재고') || k.includes('안전재고')));
                        const hasOutboundKeywords = headerRow.some(k => typeof k === 'string' && (k.includes('출고일시') || k.includes('출고량') || k.includes('주문일')));

                        if (wb.SheetNames.length >= 2 && !file.name.toLowerCase().includes('.csv')) {
                            isStockFile = true;
                            isOutboundFile = true;
                            const sData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
                            const oData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[1]], { header: 1, raw: true, defval: '' });
                            
                            rawStock = hasParsedStockHeader ? rawStock.concat(sData.slice(1)) : sData;
                            rawOutbound = hasParsedOutboundHeader ? rawOutbound.concat(oData.slice(1)) : oData;
                            hasParsedStockHeader = true;
                            hasParsedOutboundHeader = true;
                        } else {
                            if (hasStockKeywords) {
                                isStockFile = true;
                                rawStock = hasParsedStockHeader ? rawStock.concat(sheetData.slice(1)) : sheetData;
                                hasParsedStockHeader = true;
                            } else if (hasOutboundKeywords) {
                                isOutboundFile = true;
                                rawOutbound = hasParsedOutboundHeader ? rawOutbound.concat(sheetData.slice(1)) : sheetData;
                                hasParsedOutboundHeader = true;
                            } else {
                                throw new Error(`[${file.name}] 엑셀 내부에 필수 헤더가 존재하지 않습니다.`);
                            }
                        }
                    }

                    let latestHistory = histories.length > 0 ? histories[0] : null;
                    
                    const findIdxPriority = (header, keywords, fallback) => {
                        for (const k of keywords) {
                            const idx = header.findIndex(col => String(col).trim() === k);
                            if (idx !== -1) return idx;
                        }
                        for (const k of keywords) {
                            const idx = header.findIndex(col => String(col).trim().includes(k));
                            if (idx !== -1) return idx;
                        }
                        return fallback;
                    };

                    const outboundMap = {};
                    let globalMaxDateObj = new Date(0);
                    let baseTime = latestHistory ? latestHistory.baseDate : new Date().getTime();
                    
                    let minUploadTimeMs = Infinity;
                    let maxUploadTimeMs = 0;

                    let header2 = [];
                    let h2DateIdx = -1;
                    let h2NameIdx = -1;
                    let h2QtyIdx = -1;

                    if (isOutboundFile) {
                        header2 = rawOutbound[0] || [];
                        h2DateIdx = findIdxPriority(header2, ['출고일시', '주문일'], 6);
                        h2NameIdx = findIdxPriority(header2, ['자사 상품명', '상품명'], 7);
                        h2QtyIdx = findIdxPriority(header2, ['출고량', '출고수량', '수량'], 8);

                        // v51: 중복 데이터 원천 차단 복구 (숨겨진 쌍둥이 행, 중복 파일 업로드로 인한 뻥튀기 완벽 방어)
                        const seenRows = new Set();
                        const validOutboundRows = [];

                        rawOutbound.forEach((row, idx) => {
                            if (idx === 0) {
                                validOutboundRows.push(row);
                                return;
                            }
                            if (!row || row.length === 0) return;

                            // 해시 키 생성 (주문번호, 송장번호 등이 포함되므로 진짜 동일한 행만 걸러짐)
                            const uniqueKey = row.map(cell => {
                                if (cell == null) return '';
                                if (cell instanceof Date) return cell.getTime();
                                return String(cell).trim();
                            }).join("|");

                            if (!seenRows.has(uniqueKey)) {
                                seenRows.add(uniqueKey);
                                validOutboundRows.push(row);
                            }
                        });
                        rawOutbound = validOutboundRows;

                        rawOutbound.forEach((row, idx) => {
                            if (idx === 0 || !row || row.length === 0) return;
                            const d = parseExcelDate(row[h2DateIdx]);
                            if (d && !isNaN(d.getTime())) {
                                const ms = d.getTime();
                                if (ms < minUploadTimeMs) minUploadTimeMs = ms;
                                if (ms > maxUploadTimeMs) maxUploadTimeMs = ms;
                                
                                if (ms > globalMaxDateObj.getTime()) {
                                    globalMaxDateObj = d;
                                }
                            }
                        });

                        if (globalMaxDateObj.getTime() > 0) {
                            const baseDateObj = new Date(globalMaxDateObj.getFullYear(), globalMaxDateObj.getMonth(), globalMaxDateObj.getDate(), 23, 59, 59, 999);
                            baseTime = baseDateObj.getTime();
                        }
                    }

                    if (latestHistory) {
                        latestHistory.items.forEach(item => {
                            const preservedDaily = { ...(item.daily || {}) };
                            
                            if (isOutboundFile && minUploadTimeMs <= maxUploadTimeMs) {
                                const minD = new Date(minUploadTimeMs);
                                const maxD = new Date(maxUploadTimeMs);
                                const minTime = new Date(minD.getFullYear(), minD.getMonth(), minD.getDate(), 0, 0, 0).getTime();
                                const maxTime = new Date(maxD.getFullYear(), maxD.getMonth(), maxD.getDate(), 23, 59, 59).getTime();

                                Object.keys(preservedDaily).forEach(dKey => {
                                    const [y, m, dStr] = dKey.split('-');
                                    const keyTime = new Date(y, m - 1, dStr, 12, 0, 0).getTime();
                                    if (keyTime >= minTime && keyTime <= maxTime) {
                                        delete preservedDaily[dKey]; 
                                    }
                                });
                            }
                            
                            outboundMap[item.itemName] = {
                                out_30: 0,
                                out_15: 0,
                                out_7: 0,
                                daily: preservedDaily
                            };
                        });
                    }

                    if (isOutboundFile) {
                        const baseDateForRange = new Date(baseTime);
                        const time30 = new Date(baseDateForRange.getFullYear(), baseDateForRange.getMonth(), baseDateForRange.getDate() - 29, 0, 0, 0, 0).getTime();
                        const time15 = new Date(baseDateForRange.getFullYear(), baseDateForRange.getMonth(), baseDateForRange.getDate() - 14, 0, 0, 0, 0).getTime();
                        const time7 = new Date(baseDateForRange.getFullYear(), baseDateForRange.getMonth(), baseDateForRange.getDate() - 6, 0, 0, 0, 0).getTime();

                        rawOutbound.forEach((row, idx) => {
                            if (idx === 0 || !row || row.length === 0) return;
                            
                            const itemName = String(row[h2NameIdx] || '').trim();
                            const amtStr = String(row[h2QtyIdx] || "0").replace(/,/g, '');
                            const amt = parseFloat(amtStr) || 0;
                            
                            if (!itemName) return;
                            const d = parseExcelDate(row[h2DateIdx]);
                            if (!d || isNaN(d.getTime())) return;
                            
                            if (!outboundMap[itemName]) {
                                outboundMap[itemName] = { out_30: 0, out_15: 0, out_7: 0, daily: {} };
                            }
                            
                            const dKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                            outboundMap[itemName].daily[dKey] = (outboundMap[itemName].daily[dKey] || 0) + amt;
                        });

                        Object.keys(outboundMap).forEach(itemName => {
                            let sum30 = 0, sum15 = 0, sum7 = 0;
                            Object.entries(outboundMap[itemName].daily).forEach(([dStr, amt]) => {
                                if (!dStr.includes('-')) return;
                                const [y, m, d] = dStr.split('-');
                                const dt = new Date(y, m - 1, d, 12, 0, 0).getTime();
                                
                                if (dt >= time30 && dt <= baseTime) sum30 += amt;
                                if (dt >= time15 && dt <= baseTime) sum15 += amt;
                                if (dt >= time7 && dt <= baseTime) sum7 += amt;
                            });
                            outboundMap[itemName].out_30 = sum30;
                            outboundMap[itemName].out_15 = sum15;
                            outboundMap[itemName].out_7 = sum7;
                        });
                    }

                    const parsedItemsMap = new Map();

                    if (latestHistory) {
                        latestHistory.items.forEach(item => {
                            parsedItemsMap.set(item.itemName, { ...item });
                        });
                    }

                    if (isStockFile) {
                        const header1 = rawStock[0] || [];
                        const h1NameIdx = findIdxPriority(header1, ['자사 상품명', '상품명'], 4);
                        const h1StockIdx = findIdxPriority(header1, ['가용재고', '현재고', '총재고'], 5); 
                        const h1SafeStockIdx = findIdxPriority(header1, ['안전재고'], 9); 

                        rawStock.forEach((row, idx) => {
                            if (idx === 0 || !row) return; 
                            const itemName = String(row[h1NameIdx] || '').trim(); 
                            const stockStr = String(row[h1StockIdx] || "0").replace(/,/g, '');
                            const stock = parseFloat(stockStr) || 0; 
                            
                            const safeStockStr = String(row[h1SafeStockIdx] || "0").replace(/,/g, '');
                            const safeStock = parseFloat(safeStockStr) || 0;

                            if (!itemName || itemName === '상품명' || itemName === '자사 상품명') return;
                            
                            const existing = parsedItemsMap.get(itemName) || {};
                            parsedItemsMap.set(itemName, {
                                ...existing,
                                itemName,
                                stock,
                                safeStock
                            });
                        });
                    }

                    const finalItems = Array.from(parsedItemsMap.values()).map(item => {
                        const outData = outboundMap[item.itemName] || { out_30: 0, out_15: 0, out_7: 0, daily: {} };
                        return {
                            ...item,
                            out_30: outData.out_30,
                            out_15: outData.out_15,
                            out_7: outData.out_7,
                            daily: outData.daily
                        };
                    });

                    const nextVersion = `V${histories.length + 1}`;
                    const now = new Date().toISOString();
                    
                    const newDocData = { 
                        version: nextVersion, 
                        createdAt: now, 
                        baseDate: baseTime,
                        items: finalItems 
                    };

                    if (firebaseRefs) {
                        const { db, appId, collection, addDoc } = firebaseRefs;
                        const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'inventory_history');
                        const newDoc = await addDoc(collRef, newDocData);
                        setSelectedHistoryId(newDoc.id);
                        
                        let msg = "업데이트 완료 ";
                        if (isStockFile && isOutboundFile) msg += "(재고/출고 통합 반영)";
                        else if (isStockFile) msg += "(현재고 단독)";
                        else if (isOutboundFile) msg += "(출고수량 단독)";
                        
                        const displayDate = new Date(baseTime).toLocaleDateString();
                        setToastMessage(`${msg} - 수량 완벽 교정 완료 / 기준일: ${displayDate}`);
                    }

                } catch (error) {
                    console.error("Excel parse error:", error);
                    const errMsg = error.message ? error.message.toLowerCase() : "";
                    if (errMsg.includes('password') || errMsg.includes('암호')) {
                        alert("🚨 파일 업로드 실패 (비밀번호 잠금)\n\n업로드하신 엑셀 파일에 [비밀번호]가 설정되어 있어 보안상 브라우저가 데이터를 읽을 수 없습니다.\n\n[해결 방법]\n1. 엑셀(Excel) 프로그램에서 해당 파일을 엽니다.\n2. '다른 이름으로 저장'을 클릭합니다.\n3. 도구(일반 옵션)에서 설정된 비밀번호를 지우고 저장합니다.\n4. 비밀번호가 해제된 파일을 다시 업로드해 주세요.");
                    } else {
                        alert(`❌ 엑셀 분석 실패\n\n알 수 없는 형식의 파일입니다. 엑셀에서 파일을 열고 [다른 이름으로 저장] > [Excel 통합 문서(*.xlsx)]로 다시 저장한 뒤 업로드해 주세요.\n\n(상세에러: ${error.message})`);
                    }
                } finally {
                    setIsUploading(false);
                    e.target.value = null;
                }
            };

            // v52: 위킵(FBW) 재고 엑셀 업로드 처리
            // 위킵 엑셀 고유 헤더: SKU번호 / 상품명 / 가용재고 / 안전재고 / 유보재고 / 하자재고 / 재고회전률 / 월평균출고량 / 일평균출고량
            const handleWeekeepFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                setWkIsUploading(true);

                try {
                    const fileReads = files.map(file => {
                        return new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = (evt) => resolve({ file, data: evt.target.result });
                            reader.onerror = reject;
                            reader.readAsBinaryString(file);
                        });
                    });

                    const results = await Promise.all(fileReads);
                    const itemsMap = new Map();

                    for (const result of results) {
                        const { file, data: fileString } = result;
                        const wb = XLSX.read(fileString, { type: 'binary', cellDates: true });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const sheetData = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
                        const header = sheetData[0] || [];

                        const findIdx = (keywords, fallback) => {
                            for (const k of keywords) {
                                const idx = header.findIndex(col => String(col).trim() === k);
                                if (idx !== -1) return idx;
                            }
                            return fallback;
                        };

                        const hasWeekeepKeywords = header.some(k => typeof k === 'string' && (k.includes('유보재고') || k.includes('하자재고')));
                        if (!hasWeekeepKeywords) {
                            throw new Error(`[${file.name}] 위킵(FBW) 재고 엑셀 형식이 아닙니다. (유보재고/하자재고 컬럼 없음)`);
                        }

                        const nameIdx = findIdx(['상품명'], 1);
                        const availIdx = findIdx(['가용재고'], 9);
                        const safeIdx = findIdx(['안전재고'], 10);
                        const reservedIdx = findIdx(['유보재고'], 11);
                        const defectiveIdx = findIdx(['하자재고'], 12);
                        const turnoverIdx = findIdx(['재고회전률', '재고회전율'], 6);
                        const monthlyOutIdx = findIdx(['월평균출고량'], 7);
                        const dailyOutIdx = findIdx(['일평균출고량'], 8);
                        const supplierIdx = findIdx(['공급처'], 5);

                        sheetData.forEach((row, idx) => {
                            if (idx === 0 || !row || row.length === 0) return;
                            const itemName = String(row[nameIdx] || '').trim();
                            if (!itemName || itemName === '상품명') return;

                            const toNum = (v) => parseFloat(String(v || '0').replace(/,/g, '')) || 0;

                            itemsMap.set(itemName, {
                                itemName,
                                stock: toNum(row[availIdx]),
                                safeStock: toNum(row[safeIdx]),
                                reservedStock: toNum(row[reservedIdx]),
                                defectiveStock: toNum(row[defectiveIdx]),
                                turnoverRate: toNum(row[turnoverIdx]),
                                avgMonthlyOut: toNum(row[monthlyOutIdx]),
                                avgDailyOut: toNum(row[dailyOutIdx]),
                                supplier: String(row[supplierIdx] || '').trim()
                            });
                        });
                    }

                    const finalItems = Array.from(itemsMap.values());
                    if (finalItems.length === 0) {
                        throw new Error("엑셀에서 유효한 품목 데이터를 찾지 못했습니다.");
                    }

                    const nextVersion = `V${wkHistories.length + 1}`;
                    const now = new Date().toISOString();
                    const newDocData = {
                        version: nextVersion,
                        createdAt: now,
                        items: finalItems
                    };

                    if (firebaseRefs) {
                        const { db, appId, collection, addDoc } = firebaseRefs;
                        const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'weekeep_inventory');
                        const newDoc = await addDoc(collRef, newDocData);
                        setWkSelectedHistoryId(newDoc.id);
                        setToastMessage(`✅ 위킵(FBW) 재고 업데이트 완료 - ${finalItems.length}개 품목 반영`);
                    }
                } catch (error) {
                    console.error("Weekeep Excel parse error:", error);
                    alert(`❌ 위킵 엑셀 분석 실패\n\n${error.message}`);
                } finally {
                    setWkIsUploading(false);
                    e.target.value = null;
                }
            };

            const handleResetWeekeepDB = async () => {
                if (!firebaseRefs) return;
                const isConfirmed = window.confirm("🚨 경고: 클라우드에 저장된 위킵(FBW) 재고 이력을 완전히 삭제하고 초기화합니다.\n\n정말 초기화 하시겠습니까?");
                if (!isConfirmed) return;

                try {
                    const { db, appId, collection, getDocs, deleteDoc } = firebaseRefs;
                    const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'weekeep_inventory');
                    const snapshot = await getDocs(collRef);

                    const deletePromises = [];
                    snapshot.forEach(docSnap => {
                        deletePromises.push(deleteDoc(docSnap.ref));
                    });
                    await Promise.all(deletePromises);

                    setToastMessage("위킵 클라우드 DB가 초기화되었습니다. 엑셀을 새로 업로드해 주세요.");
                } catch (error) {
                    console.error("Weekeep DB Reset error:", error);
                    alert("초기화 중 오류가 발생했습니다.");
                }
            };

            const formatDate = (isoString) => {
                const d = new Date(isoString);
                return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            };

            const getFileNameDate = (isoString) => {
                const d = new Date(isoString);
                return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
            };

            const currentData = useMemo(() => {
                return histories.find(h => h.id === selectedHistoryId) || null;
            }, [histories, selectedHistoryId]);

            useEffect(() => {
                if (currentData && currentData.baseDate) {
                    const end = new Date(currentData.baseDate);
                    const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                    
                    setCustomEndDate(fmt(end));
                    setCustomStartDate(fmt(end));
                }
            }, [currentData]);

            const displayDateRange = useMemo(() => {
                if (!currentData || !currentData.baseDate) return "";
                if (viewMode === 'period') {
                    const end = new Date(currentData.baseDate);
                    const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - (selectedPeriod - 1));
                    return `${start.getMonth()+1}/${start.getDate()} ~ ${end.getMonth()+1}/${end.getDate()}`;
                } else {
                    if (!customStartDate || !customEndDate) return "날짜를 선택해주세요";
                    const start = new Date(customStartDate);
                    const end = new Date(customEndDate);
                    
                    if (start.getTime() === end.getTime()) {
                        return `${start.getMonth()+1}/${start.getDate()}`;
                    }
                    
                    const minDate = start < end ? start : end;
                    const maxDate = start > end ? start : end;
                    return `${minDate.getMonth()+1}/${minDate.getDate()} ~ ${maxDate.getMonth()+1}/${maxDate.getDate()}`;
                }
            }, [currentData, selectedPeriod, viewMode, customStartDate, customEndDate]);

            const processedItems = useMemo(() => {
                if (!currentData) return [];
                
                let sTime = 0, eTime = 0;
                if (viewMode === 'custom' && customStartDate && customEndDate) {
                    const parseSafe = (dStr, isEnd) => {
                        const [y, m, d] = dStr.split('-');
                        return isEnd ? new Date(y, m - 1, d, 23, 59, 59, 999).getTime() : new Date(y, m - 1, d, 0, 0, 0, 0).getTime();
                    };
                    sTime = parseSafe(customStartDate, false);
                    eTime = parseSafe(customEndDate, true);
                    if (sTime > eTime) {
                        const temp = sTime;
                        sTime = eTime;
                        eTime = temp;
                    }
                }

                return currentData.items.map(item => {
                    let outbound = 0;
                    let periodToUse = 30;

                    if (viewMode === 'period') {
                        const isLegacy = item.out_30 === undefined;
                        if (isLegacy) {
                            outbound = item.outbound || 0;
                            periodToUse = currentData.period || 30; 
                        } else {
                            outbound = item[`out_${selectedPeriod}`] || 0;
                            periodToUse = selectedPeriod;
                        }
                    } else if (viewMode === 'custom') {
                        if (sTime > 0 && eTime > 0 && item.daily) {
                            let sum = 0;
                            Object.entries(item.daily).forEach(([dStr, amt]) => {
                                if (!dStr.includes('-')) return;
                                const [y, m, d] = dStr.split('-');
                                const dt = new Date(y, m - 1, d, 12, 0, 0).getTime();
                                if (dt >= sTime && dt <= eTime) sum += amt;
                            });
                            outbound = sum;
                            const days = Math.max(1, Math.ceil((eTime - sTime) / 86400000));
                            periodToUse = days;
                        }
                    }
                    
                    const daily = outbound / periodToUse;
                    let availableDays = null;
                    if (daily > 0) {
                        availableDays = Math.floor(item.stock / daily);
                    }

                    let mainGroup = null;
                    let displayName = item.itemName; 
                    const match = item.itemName.match(/^(\d+)/);
                    if (match) {
                        mainGroup = match[1]; 
                    }
                    
                    return {
                        ...item,
                        safeStock: item.safeStock || 0, 
                        _outboundToDisplay: outbound,
                        _dailyToDisplay: daily,
                        _availableDays: availableDays,
                        _periodToUse: periodToUse,
                        _mainGroup: mainGroup,
                        _displayName: displayName
                    };
                }).filter(item => {
                    if (!item._mainGroup) return false;
                    
                    if (searchKeyword && !item._displayName.toLowerCase().includes(searchKeyword.toLowerCase())) {
                        return false;
                    }

                    if (showWarningOnly) {
                        return item._availableDays !== null && item._availableDays < 30 && item.stock > 0;
                    }
                    return true;
                });
            }, [currentData, showWarningOnly, selectedPeriod, viewMode, customStartDate, customEndDate, searchKeyword]);

            // v52: 위킵(FBW) 최신 스냅샷
            const wkCurrentData = useMemo(() => {
                return wkHistories.find(h => h.id === wkSelectedHistoryId) || null;
            }, [wkHistories, wkSelectedHistoryId]);

            const wkProcessedItems = useMemo(() => {
                if (!wkCurrentData) return [];
                let items = wkCurrentData.items.map(item => ({ ...item }));
                if (wkSearchKeyword) {
                    items = items.filter(i => i.itemName.toLowerCase().includes(wkSearchKeyword.toLowerCase()));
                }
                items.sort((a, b) => a.itemName.localeCompare(b.itemName, 'ko', { numeric: true }));
                return items;
            }, [wkCurrentData, wkSearchKeyword]);

            // v52: CL + 위킵 총재고 통합 (상품명 기준 매칭)
            const combinedItems = useMemo(() => {
                const map = new Map();

                if (currentData) {
                    currentData.items.forEach(item => {
                        if (!item.itemName || !item.itemName.match(/^(\d+)/)) return;
                        map.set(item.itemName, {
                            itemName: item.itemName,
                            clStock: item.stock || 0,
                            wkStock: 0,
                            inCl: true,
                            inWk: false
                        });
                    });
                }

                if (wkCurrentData) {
                    wkCurrentData.items.forEach(item => {
                        const existing = map.get(item.itemName);
                        if (existing) {
                            existing.wkStock = item.stock || 0;
                            existing.inWk = true;
                        } else {
                            map.set(item.itemName, {
                                itemName: item.itemName,
                                clStock: 0,
                                wkStock: item.stock || 0,
                                inCl: false,
                                inWk: true
                            });
                        }
                    });
                }

                let items = Array.from(map.values()).map(i => ({ ...i, total: i.clStock + i.wkStock }));

                if (totalSearchKeyword) {
                    items = items.filter(i => i.itemName.toLowerCase().includes(totalSearchKeyword.toLowerCase()));
                }

                items.sort((a, b) => a.itemName.localeCompare(b.itemName, 'ko', { numeric: true }));
                return items;
            }, [currentData, wkCurrentData, totalSearchKeyword]);

            const combinedSummary = useMemo(() => {
                const all = combinedItems;
                const clTotal = all.reduce((sum, i) => sum + i.clStock, 0);
                const wkTotal = all.reduce((sum, i) => sum + i.wkStock, 0);
                const grandTotal = clTotal + wkTotal;
                const migrationRate = grandTotal > 0 ? (wkTotal / grandTotal * 100) : 0;
                const unmatchedCount = all.filter(i => !(i.inCl && i.inWk) && i.total > 0).length;
                return { clTotal, wkTotal, grandTotal, migrationRate, unmatchedCount, itemCount: all.length };
            }, [combinedItems]);

            const exportToExcel = () => {
                if (!processedItems || processedItems.length === 0) {
                    alert("다운로드할 데이터가 없습니다.");
                    return;
                }

                let dynamicColName = `출고수량`;
                if (viewMode === 'period') {
                    dynamicColName = `출고수량(${selectedPeriod}일)`;
                } else if (viewMode === 'custom' && customStartDate && customEndDate) {
                    dynamicColName = `출고수량(${displayDateRange})`;
                }

                const exportData = processedItems.map(item => {
                    const rowData = {
                        "상품명": item._displayName,
                        "총재고": item.stock,
                        "안전재고": item.safeStock || 0,
                        [dynamicColName]: item._outboundToDisplay
                    };
                    
                    if (viewMode === 'period') {
                        rowData["일평균"] = item._outboundToDisplay > 0 ? item._dailyToDisplay.toFixed(1) : "-";
                        rowData["예상 소진일(일)"] = item._availableDays === null ? "출고 없음" : item._availableDays;
                    }
                    return rowData;
                });

                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                
                const wscols = viewMode === 'period' 
                    ? [{wch: 40}, {wch: 10}, {wch: 10}, {wch: 20}, {wch: 15}, {wch: 15}]
                    : [{wch: 40}, {wch: 10}, {wch: 10}, {wch: 25}];
                worksheet['!cols'] = wscols;

                XLSX.utils.book_append_sheet(workbook, worksheet, "재고소진예상일");
                
                let rangeStr = viewMode === 'period' ? `${selectedPeriod}일` : '지정일';
                
                const currentDownloadTime = new Date().toISOString();
                const fileName = `재고소진분석_${rangeStr}_${getFileNameDate(currentDownloadTime)}.xlsx`;
                XLSX.writeFile(workbook, fileName);
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-10 border border-slate-200">
                            <div className="text-center mb-8">
                                <div className="bg-indigo-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                    <svg className="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                </div>
                                <h2 className="text-2xl font-bold text-slate-800">보안 접근</h2>
                                <p className="text-sm text-slate-500 mt-2">관리자 권한이 필요합니다.</p>
                            </div>
                            <form onSubmit={handleLogin}>
                                <input 
                                    type="password" 
                                    value={pin}
                                    onChange={(e) => setPin(e.target.value)}
                                    placeholder="비밀번호 입력"
                                    className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center text-lg tracking-widest font-semibold text-slate-700 mb-4"
                                    autoFocus
                                />
                                {errorMsg && <p className="text-red-500 text-sm text-center mb-4">{errorMsg}</p>}
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition-colors shadow-md">
                                    접속하기
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 relative">
                    
                    {toastMessage && (
                        <div 
                            className="fixed inset-0 z-50 flex justify-center items-start pt-6"
                            onClick={() => setToastMessage("")}
                        >
                            <div 
                                className="bg-white border border-slate-200 shadow-xl rounded-2xl p-4 flex items-center gap-4 animate-slide-down max-w-sm w-full mx-4 cursor-default"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <div className="bg-green-100 text-green-600 rounded-full p-2.5 flex-shrink-0">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <div className="flex-grow">
                                    <h4 className="text-sm font-bold text-slate-800">시스템 알림</h4>
                                    <p className="text-xs text-slate-500 mt-0.5">{toastMessage}</p>
                                </div>
                                <button onClick={() => setToastMessage("")} className="text-slate-400 hover:text-slate-600 p-1 flex-shrink-0">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="glass-effect relative z-30 border-b border-slate-200 px-6 py-4 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">

                                                    <tr>
                                                        <td colSpan="7" className="px-6 py-16 text-center text-slate-500 font-medium border-t border-slate-100">
                                                            {wkCurrentData ? '검색 조건에 일치하는 품목이 없습니다.' : '등록된 데이터가 없습니다. 아래에서 위킵 재고 엑셀 파일을 업로드해주세요.'}
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                                    <div className="mb-4 flex items-center justify-between">
                                        <div className="flex items-center gap-3">
                                            <h4 className="font-extrabold text-slate-800 text-base flex items-center gap-2">📂 위킵(FBW) 재고 엑셀 업데이트</h4>
                                            <button onClick={handleResetWeekeepDB} className="text-xs text-red-500 hover:text-red-700 font-bold underline px-2 py-0.5 rounded transition-colors">
                                                DB 전체 초기화
                                            </button>
                                        </div>
                                        <span className="text-xs text-slate-400">위킵에서 다운로드한 재고 엑셀을 그대로 업로드하세요.</span>
                                    </div>
                                    <div className={`border-2 border-dashed rounded-xl p-8 text-center transition-colors relative ${wkIsUploading ? 'border-slate-300 bg-slate-50' : 'border-orange-300 hover:border-orange-500 bg-orange-50/30 cursor-pointer'}`}>
                                        <input type="file" multiple accept=".xlsx,.xls,.csv" onChange={handleWeekeepFileUpload} disabled={wkIsUploading} className="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10 disabled:cursor-not-allowed"/>
                                        {wkIsUploading ? (
                                            <div className="flex flex-col items-center justify-center">
                                                <div className="w-8 h-8 border-4 border-orange-200 border-t-orange-600 rounded-full animate-spin mb-3"></div>
                                                <h5 className="text-sm font-bold text-slate-600">데이터를 분석 및 반영 중입니다...</h5>
                                            </div>
                                        ) : (
                                            <>
                                                <div className="bg-white w-12 h-12 rounded-full shadow-sm flex items-center justify-center mx-auto mb-3 text-2xl">📥</div>
                                                <h5 className="text-sm font-extrabold text-orange-900">클릭하거나 위킵 재고 엑셀을 드롭하세요</h5>
                                                <p className="text-xs text-slate-400 mt-1">SKU번호 / 상품명 / 가용재고 / 안전재고 / 유보재고 / 하자재고 컬럼을 자동 인식합니다.</p>
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'total' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
                                        <p className="text-xs font-bold text-slate-400">전체 품목 수</p>
                                        <p className="text-2xl font-black text-slate-800 mt-1">{combinedSummary.itemCount.toLocaleString()}개</p>
                                    </div>
                                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 border-l-4 border-l-indigo-500">
                                        <p className="text-xs font-bold text-slate-400">CL 시스템 재고</p>
                                        <p className="text-2xl font-black text-indigo-700 mt-1">{combinedSummary.clTotal.toLocaleString()}개</p>
                                    </div>
                                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 border-l-4 border-l-orange-500">
                                        <p className="text-xs font-bold text-slate-400">위킵(FBW) 재고</p>
                                        <p className="text-2xl font-black text-orange-600 mt-1">{combinedSummary.wkTotal.toLocaleString()}개</p>
                                    </div>
                                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 border-l-4 border-l-slate-700">
                                        <p className="text-xs font-bold text-slate-400">총 합계</p>
                                        <p className="text-2xl font-black text-slate-900 mt-1">{combinedSummary.grandTotal.toLocaleString()}개</p>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                                    <div className="flex justify-between items-center mb-2">
                                        <h3 className="text-sm font-extrabold text-slate-700">위킵 이관 진행률</h3>
                                        <span className="text-sm font-black text-orange-600">{combinedSummary.migrationRate.toFixed(1)}%</span>
                                    </div>
                                    <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                                        <div className="h-3 bg-orange-500 rounded-full transition-all" style={{ width: `${Math.min(100, combinedSummary.migrationRate)}%` }}></div>
                                    </div>
                                    {combinedSummary.unmatchedCount > 0 && (
                                        <p className="text-xs text-slate-400 mt-3">
                                            ⚠️ {combinedSummary.unmatchedCount}개 품목이 CL 또는 위킵 중 한쪽 시스템에만 존재합니다 (아래 표에서 뱃지로 확인 가능).
                                        </p>
                                    )}
                                </div>

                                <div className="flex justify-end">
                                    <input
                                        type="text"
                                        placeholder="🔍 상품명 검색..."
                                        value={totalSearchKeyword}
                                        onChange={(e) => setTotalSearchKeyword(e.target.value)}
                                        className="px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:border-slate-400 focus:ring-1 focus:ring-slate-400 w-56 transition-all"
                                    />
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative">
                                    <div style={{ maxHeight: '800px' }} className="overflow-y-auto custom-scrollbar">
                                        <table className="w-full min-w-[850px] text-sm text-slate-600 table-fixed border-collapse">
                                            <thead className="bg-slate-50 sticky top-0 z-40 shadow-sm ring-1 ring-slate-200">
                                                <tr>
                                                    <th scope="col" className="w-[38%] px-4 py-4 text-[15px] font-extrabold border-b-2 border-slate-300 text-slate-800 text-left">상품명</th>
                                                    <th scope="col" className="w-[16%] px-4 py-4 text-[15px] font-extrabold border-b-2 border-slate-300 text-indigo-700 text-center">CL 재고</th>
                                                    <th scope="col" className="w-[16%] px-4 py-4 text-[15px] font-extrabold border-b-2 border-slate-300 text-orange-600 text-center">위킵 재고</th>
                                                    <th scope="col" className="w-[16%] px-4 py-4 text-[15px] font-extrabold border-b-2 border-slate-300 text-slate-900 text-center bg-slate-100">합계</th>
                                                    <th scope="col" className="w-[14%] px-4 py-4 text-[15px] font-extrabold border-b-2 border-slate-300 text-slate-800 text-center">상태</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {combinedItems.length > 0 ? (
                                                    combinedItems.map((item, idx) => (
                                                        <tr key={idx} className="border-t border-slate-100 bg-white hover:bg-slate-50 transition-colors">
                                                            <td className="px-4 py-4">
                                                                <div className="font-bold truncate text-slate-800" title={item.itemName}>{item.itemName}</div>
                                                            </td>
                                                            <td className="px-4 py-4 text-center font-black text-[15px] text-indigo-700">{item.clStock.toLocaleString()}</td>
                                                            <td className="px-4 py-4 text-center font-black text-[15px] text-orange-600">{item.wkStock.toLocaleString()}</td>
                                                            <td className="px-4 py-4 text-center font-black text-[15px] text-slate-900 bg-slate-50">{item.total.toLocaleString()}</td>
                                                            <td className="px-4 py-4 text-center">
                                                                {item.inCl && item.inWk ? (
                                                                    <span className="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-1 rounded-full">양쪽 등록</span>
                                                                ) : item.inCl ? (
                                                                    <span className="text-xs font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 px-2 py-1 rounded-full">CL만</span>
                                                                ) : (
                                                                    <span className="text-xs font-bold text-orange-700 bg-orange-50 border border-orange-200 px-2 py-1 rounded-full">위킵만</span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    ))
                                                ) : (
                                                    <tr>
                                                        <td colSpan="5" className="px-6 py-16 text-center text-slate-500 font-medium border-t border-slate-100">
                                                            표시할 데이터가 없습니다. CL 시스템 또는 위킵 탭에서 재고 데이터를 업로드해주세요.
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
