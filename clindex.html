                                                    <th scope="col" onClick={makeSortClick('safeStock', wkSortKey, wkSortDir, setWkSortKey, setWkSortDir)} className="w-[9%] px-4 py-4 text-[15px] font-extrabold border-b-2 border-slate-300 text-slate-800 text-center bg-slate-200/50 cursor-pointer select-none hover:bg-slate-300/40">안전재고<SortArrow active={wkSortKey === 'safeStock'} dir={wkSortDir} /></th>
                                                    <th scope="col" onClick={makeSortClick('_outboundToDisplay', wkSortKey, wkSortDir, setWkSortKey, setWkSortDir)} className="w-[13%] px-4 py-3 text-[15px] font-extrabold border-b-2 border-slate-300 text-slate-800 text-center leading-tight cursor-pointer select-none hover:bg-slate-100">{wkViewMode === 'period' ? `출고수량(${wkSelectedPeriod}일)` : '지정일 출고수량'}<SortArrow active={wkSortKey === '_outboundToDisplay'} dir={wkSortDir} /></th>
                                                    <th scope="col" onClick={makeSortClick('_dailyToDisplay', wkSortKey, wkSortDir, setWkSortKey, setWkSortDir)} className="w-[9%] px-4 py-4 text-[15px] font-extrabold border-b-2 border-slate-300 text-slate-800 text-center cursor-pointer select-none hover:bg-slate-100">일평균<SortArrow active={wkSortKey === '_dailyToDisplay'} dir={wkSortDir} /></th>
                                                    <th scope="col" onClick={makeSortClick('_availableDays', wkSortKey, wkSortDir, setWkSortKey, setWkSortDir)} className="w-[16%] px-4 py-4 text-[15px] font-extrabold text-orange-900 bg-orange-100/50 border-b-2 border-orange-200 text-center cursor-pointer select-none hover:bg-orange-100">예상 소진일<SortArrow active={wkSortKey === '_availableDays'} dir={wkSortDir} /></th>
                                                    <th scope="col" onClick={makeSortClick('reservedStock', wkSortKey, wkSortDir, setWkSortKey, setWkSortDir)} className="w-[12%] px-4 py-4 text-[15px] font-extrabold border-b-2 border-slate-300 text-slate-800 text-center cursor-pointer select-none hover:bg-slate-100">유보재고<SortArrow active={wkSortKey === 'reservedStock'} dir={wkSortDir} /></th>
                                                    <th scope="col" onClick={makeSortClick('defectiveStock', wkSortKey, wkSortDir, setWkSortKey, setWkSortDir)} className="w-[12%] px-4 py-4 text-[15px] font-extrabold border-b-2 border-slate-300 text-slate-800 text-center cursor-pointer select-none hover:bg-slate-100">하자재고<SortArrow active={wkSortKey === 'defectiveStock'} dir={wkSortDir} /></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {wkCurrentData ? (
                                                    wkProcessedItems.length > 0 ? (
                                                        wkProcessedItems.map((item, idx) => {
                                                            const isWarning = item._availableDays !== null && item._availableDays < 30;
                                                            return (
                                                                <tr key={idx} className={`border-t border-slate-100 transition-colors ${isWarning ? 'bg-red-50 hover:bg-red-100' : 'bg-white hover:bg-slate-50'}`}>
                                                                    <td className="px-4 py-4"><div className={`font-bold truncate ${isWarning ? 'text-red-900' : 'text-slate-800'}`} title={item.itemName}>{item.itemName}</div></td>
                                                                    <td className={`px-4 py-4 text-center font-black text-[15px] ${isWarning ? 'text-red-800' : 'text-orange-600'}`}>{(item.stock || 0).toLocaleString()}</td>
                                                                    <td className={`px-4 py-4 text-center font-black text-[15px] ${isWarning ? 'text-red-800 bg-red-100/50' : 'text-slate-500 bg-slate-100/80'}`}>{(item.safeStock || 0).toLocaleString()}</td>
                                                                    <td className={`px-4 py-4 text-center font-black text-[15px] ${isWarning ? 'text-red-800' : 'text-slate-700'}`}>{(item._outboundToDisplay || 0).toLocaleString()}</td>
                                                                    <td className={`px-4 py-4 text-center font-black text-[15px] ${isWarning ? 'text-red-700' : 'text-slate-600'}`}>{item._outboundToDisplay > 0 ? item._dailyToDisplay.toFixed(1) : '-'}</td>
                                                                    <td className={`px-4 py-4 text-center font-black text-[15px] ${isWarning ? 'text-red-600' : 'text-orange-600'}`}>
                                                                        {item._availableDays === null ? <span className="text-slate-400 font-bold text-[14px]">출고 없음</span> : <span>{item._availableDays.toLocaleString()} 일</span>}
                                                                    </td>
                                                                    <td className="px-4 py-4 text-center font-semibold text-slate-600">{(item.reservedStock || 0).toLocaleString()}</td>
                                                                    <td className={`px-4 py-4 text-center font-semibold ${(item.defectiveStock || 0) > 0 ? 'text-red-600' : 'text-slate-400'}`}>{(item.defectiveStock || 0).toLocaleString()}</td>
                                                                </tr>
                                                            );
                                                        })
                                                    ) : ( <tr><td colSpan="8" className="px-6 py-16 text-center text-slate-500 font-medium border-t border-slate-100">검색 조건에 일치하는 품목이 없습니다.</td></tr> )
                                                ) : ( <tr><td colSpan="8" className="px-6 py-16 text-center text-slate-500 font-medium border-t border-slate-100">등록된 데이터가 없습니다. 하단 통합 엑셀 업로드를 통해 데이터를 추가해주세요.</td></tr> )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
