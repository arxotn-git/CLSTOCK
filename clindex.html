<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>요미몬 재고 관리 (v68)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-down { animation: slideDown 0.3s ease-out forwards; }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>

    <script>
        Babel.registerPreset('react-classic', {
            presets: [
                [Babel.availablePresets.react, { runtime: 'classic' }]
            ]
        });
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react-classic">
        const { useState, useEffect, useMemo } = React;

        // v60: 시점 재고 조회용 날짜 선택 컴포넌트 — 특정 날짜의 과거 업로드 스냅샷을 선택
        // v64: 네이티브 date input을 대체하는 커스텀 달력 컴포넌트 — 클릭 몇 번으로 월/일 선택 가능
        // v65: inline prop 추가 — true면 버튼 없이 달력 패널을 바로 펼쳐서 보여줌 (시점재고처럼 이미 팝업 안에 있는 경우)
        const MiniDatePicker = ({ value, onChange, min, max, markedDates, theme, inline }) => {
            const [open, setOpen] = useState(false);

            const themeMap = {
                indigo: { selectedBg: 'bg-indigo-600', todayRing: 'ring-indigo-400', dot: 'bg-indigo-500', hoverBg: 'hover:bg-indigo-50', navHover: 'hover:bg-indigo-50 hover:text-indigo-600' },
                orange: { selectedBg: 'bg-orange-500', todayRing: 'ring-orange-400', dot: 'bg-orange-500', hoverBg: 'hover:bg-orange-50', navHover: 'hover:bg-orange-50 hover:text-orange-600' },
                slate: { selectedBg: 'bg-slate-800', todayRing: 'ring-slate-400', dot: 'bg-slate-500', hoverBg: 'hover:bg-slate-50', navHover: 'hover:bg-slate-100 hover:text-slate-700' }
            };
            const t = themeMap[theme] || themeMap.slate;

            const parseYMD = (s) => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
            const fmtYMD = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

            const selectedDate = parseYMD(value);
            const todayStr = fmtYMD(new Date());
            const [viewDate, setViewDate] = useState(selectedDate || new Date());

            useEffect(() => { if (inline || open) setViewDate(selectedDate || new Date()); }, [open]);

            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            const startOffset = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const cells = [];
            for (let i = 0; i < startOffset; i++) cells.push(null);
            for (let d = 1; d <= daysInMonth; d++) cells.push(d);

            const minDate = min ? parseYMD(min) : null;
            const maxDate = max ? parseYMD(max) : null;

            const isDisabled = (d) => {
                const dt = new Date(year, month, d);
                if (minDate && dt < minDate) return true;
                if (maxDate && dt > maxDate) return true;
                return false;
            };

            const handlePick = (d) => {
                if (isDisabled(d)) return;
                onChange(fmtYMD(new Date(year, month, d)));
                setOpen(false);
            };

            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

            const calendarPanel = (
                <div className={inline ? "bg-white w-64" : "absolute z-50 top-full mt-2 left-0 bg-white border border-slate-200 rounded-xl shadow-lg p-3 w-64"}>
                    <div className="flex items-center justify-between mb-2">
                        <button type="button" onClick={() => setViewDate(new Date(year, month - 1, 1))} className={`w-7 h-7 flex items-center justify-center rounded-lg text-slate-500 font-bold transition-colors ${t.navHover}`}>‹</button>
                        <span className="text-sm font-bold text-slate-700">{year}년 {month + 1}월</span>
                        <button type="button" onClick={() => setViewDate(new Date(year, month + 1, 1))} className={`w-7 h-7 flex items-center justify-center rounded-lg text-slate-500 font-bold transition-colors ${t.navHover}`}>›</button>
                    </div>
                    <div className="grid grid-cols-7 gap-1 mb-1">
                        {weekdays.map(w => <div key={w} className="text-center text-[11px] font-bold text-slate-400 py-1">{w}</div>)}
                    </div>
                    <div className="grid grid-cols-7 gap-1">
                        {cells.map((d, idx) => {
                            if (d === null) return <div key={idx}></div>;
                            const dStr = fmtYMD(new Date(year, month, d));
                            const disabled = isDisabled(d);
                            const isSelected = value === dStr;
                            const isToday = todayStr === dStr;
                            const hasMark = markedDates && markedDates.has(dStr);
                            return (
                                <button
                                    type="button"
                                    key={idx}
                                    disabled={disabled}
                                    onClick={() => handlePick(d)}
                                    className={`relative w-8 h-8 text-xs font-bold rounded-lg transition-colors flex items-center justify-center
                                        ${disabled ? 'text-slate-300 cursor-not-allowed' : 'text-slate-700 cursor-pointer ' + t.hoverBg}
                                        ${isSelected ? `${t.selectedBg} text-white hover:opacity-90` : ''}
                                        ${isToday && !isSelected ? `ring-1 ${t.todayRing}` : ''}
                                    `}
                                >
                                    {d}
                                    {hasMark && !isSelected && <span className={`absolute bottom-0.5 w-1 h-1 rounded-full ${t.dot}`}></span>}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );

            if (inline) {
                return calendarPanel;
            }

            return (
                <div className="relative inline-block">
                    <button
                        type="button"
                        onClick={() => setOpen(!open)}
                        className="flex items-center gap-2 px-3 py-2 text-sm font-bold text-slate-700 border border-slate-300 rounded-lg bg-white hover:bg-slate-50 transition-colors"
                    >
                        <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        {value || '날짜 선택'}
                    </button>

                    {open && (
                        <>
                            <div className="fixed inset-0 z-40" onClick={() => setOpen(false)}></div>
                            {calendarPanel}
                        </>
                    )}
                </div>
            );
        };

        const HistoryDatePicker = ({ histories, selectedId, onSelect, theme, label }) => {
            const [open, setOpen] = useState(false);
            const [pickedDate, setPickedDate] = useState('');
            const [matches, setMatches] = useState(null);
            const [fallbackNotice, setFallbackNotice] = useState('');

            const themeMap = {
                indigo: { btn: 'border-indigo-300 text-indigo-700 hover:bg-indigo-50', ring: 'focus:border-indigo-500', activeBg: 'bg-indigo-600', chip: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
                orange: { btn: 'border-orange-300 text-orange-700 hover:bg-orange-50', ring: 'focus:border-orange-500', activeBg: 'bg-orange-600', chip: 'bg-orange-50 text-orange-700 border-orange-200' },
                slate: { btn: 'border-slate-300 text-slate-700 hover:bg-slate-50', ring: 'focus:border-slate-500', activeBg: 'bg-slate-800', chip: 'bg-slate-100 text-slate-700 border-slate-300' }
            };
            const t = themeMap[theme] || themeMap.slate;
            const idleLabel = label ? `${label} 시점 재고` : '시점 재고';

            const fmtDateOnly = (iso) => {
                const d = new Date(iso);
                return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            };
            const fmtTime = (iso) => {
                const d = new Date(iso);
                return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            };

            const sortedDesc = useMemo(() => [...histories].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)), [histories]);
            const latestId = sortedDesc.length > 0 ? sortedDesc[0].id : null;
            const isLatest = !selectedId || selectedId === latestId;
            const selected = histories.find(h => h.id === selectedId) || null;

            const availableDates = useMemo(() => {
                const set = new Set(histories.map(h => fmtDateOnly(h.createdAt)));
                return Array.from(set).sort();
            }, [histories]);
            const minDate = availableDates.length > 0 ? availableDates[0] : '';
            const maxDate = availableDates.length > 0 ? availableDates[availableDates.length - 1] : '';

            // v64: 선택한 날짜에 업로드 이력이 없으면 "전체 최신"이 아니라
            // 선택한 날짜에서 가장 가까운 과거 날짜(없으면 가장 가까운 미래 날짜)의 데이터를 보여줌
            const handleDateChange = (dateStr) => {
                setPickedDate(dateStr);
                if (!dateStr) { setMatches(null); setFallbackNotice(''); return; }

                const exact = histories.filter(h => fmtDateOnly(h.createdAt) === dateStr).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                if (exact.length > 0) {
                    setFallbackNotice('');
                    setMatches(exact);
                    if (exact.length === 1) {
                        onSelect(exact[0].id);
                        setOpen(false);
                    }
                    return;
                }

                setMatches(null);
                const priorCandidates = sortedDesc.filter(h => fmtDateOnly(h.createdAt) < dateStr);
                if (priorCandidates.length > 0) {
                    const nearestDate = fmtDateOnly(priorCandidates[0].createdAt);
                    const nearestDateItems = priorCandidates.filter(h => fmtDateOnly(h.createdAt) === nearestDate);
                    const chosen = nearestDateItems[0];
                    onSelect(chosen.id);
                    setFallbackNotice(`선택하신 날짜(${dateStr})엔 업로드 이력이 없어, 가장 가까운 이전 날짜인 ${nearestDate} 데이터를 표시합니다.`);
                } else {
                    const earliest = sortedDesc[sortedDesc.length - 1];
                    if (earliest) {
                        onSelect(earliest.id);
                        const earliestDate = fmtDateOnly(earliest.createdAt);
                        setFallbackNotice(`선택하신 날짜(${dateStr}) 이전 이력이 없어, 가장 가까운 날짜인 ${earliestDate}(최초 업로드) 데이터를 표시합니다.`);
                    }
                }
            };

            const resetToLatest = () => {
                onSelect(latestId);
                setOpen(false);
                setPickedDate('');
                setMatches(null);
                setFallbackNotice('');
            };

            return (
                <div className="relative">
                    <button
                        onClick={() => setOpen(!open)}
                        className={`px-4 py-2.5 rounded-lg text-sm font-bold border shadow-sm bg-white transition-colors flex items-center gap-2 whitespace-nowrap ${isLatest ? t.btn : 'bg-amber-50 text-amber-700 border-amber-300'}`}
                    >
                        📅 {isLatest || !selected ? idleLabel : `${label ? label + ' ' : ''}${fmtDateOnly(selected.createdAt)} ${fmtTime(selected.createdAt)}`}
                    </button>

                    {open && (
                        <>
                            <div className="fixed inset-0 z-40" onClick={() => setOpen(false)}></div>
                            <div className="absolute z-50 top-full mt-2 right-0 bg-white border border-slate-200 rounded-xl shadow-lg p-4 w-72">
                                <p className="text-xs font-bold text-slate-500 mb-2">{label ? `${label} ` : ''}조회할 날짜 선택</p>
                                <MiniDatePicker value={pickedDate} onChange={handleDateChange} theme={theme} markedDates={new Set(availableDates)} inline={true} />
                                <p className="text-[11px] text-slate-400 mt-2 mb-3">업로드 이력이 있는 날짜: {minDate && maxDate ? `${minDate} ~ ${maxDate}` : '없음'} ({availableDates.length}일) · 점이 찍힌 날짜가 업로드 이력이 있는 날짜입니다.</p>

                                {fallbackNotice && (
                                    <p className="text-xs text-amber-700 font-semibold mb-3 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
                                        ⚠️ {fallbackNotice}
                                    </p>
                                )}

                                {matches && matches.length > 1 && (
                                    <div className="space-y-1 mb-3 max-h-40 overflow-y-auto">
                                        <p className="text-xs font-bold text-slate-500 mb-1">같은 날짜에 {matches.length}건의 업로드가 있습니다:</p>
                                        {matches.map(h => (
                                            <button
                                                key={h.id}
                                                onClick={() => { onSelect(h.id); setOpen(false); }}
                                                className={`w-full text-left px-3 py-2 rounded-lg text-xs font-semibold border transition-colors ${h.id === selectedId ? `text-white ${t.activeBg} border-transparent` : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`}
                                            >
                                                {fmtTime(h.createdAt)} · {h.version || '버전 정보 없음'}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {!isLatest && (
                                    <button onClick={resetToLatest} className="w-full text-center text-xs font-bold text-slate-500 hover:text-slate-800 underline pt-2 border-t border-slate-100">
                                        최신 데이터로 돌아가기
                                    </button>
                                )}
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(() => {
                return localStorage.getItem('inventory_auth_pin') === 'true';
            });
            const [pin, setPin] = useState("");
            const [errorMsg, setErrorMsg] = useState("");
            
            const [firebaseUser, setFirebaseUser] = useState(null);
            const [firebaseRefs, setFirebaseRefs] = useState(null);
            const [histories, setHistories] = useState([]);
            const [selectedHistoryId, setSelectedHistoryId] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            
            const [serverStatus, setServerStatus] = useState("connecting"); 
            const [toastMessage, setToastMessage] = useState("");
            
            const [showWarningOnly, setShowWarningOnly] = useState(false);
            const [searchKeyword, setSearchKeyword] = useState("");
            const [viewMode, setViewMode] = useState("period"); 
            const [selectedPeriod, setSelectedPeriod] = useState(30);
            
            const [customStartDate, setCustomStartDate] = useState("");
            const [customEndDate, setCustomEndDate] = useState("");

            // v54: 다중 탭 및 상세 보기 토글 상태
            const [activeTab, setActiveTab] = useState("total");
            const [wkHistories, setWkHistories] = useState([]);
            const [wkSelectedHistoryId, setWkSelectedHistoryId] = useState(null);
            const [wkSearchKeyword, setWkSearchKeyword] = useState("");
            const [totalSearchKeyword, setTotalSearchKeyword] = useState("");
            const [showDetailedStock, setShowDetailedStock] = useState(false); // v54: CL/위킵 상세 컬럼 토글

            // v58: 위킵 탭도 CL 탭과 동일하게 기간별/일자지정 분석 + 30일 이내 품절 필터 제공
            const [wkViewMode, setWkViewMode] = useState("period");
            const [wkSelectedPeriod, setWkSelectedPeriod] = useState(30);
            const [wkCustomStartDate, setWkCustomStartDate] = useState("");
            const [wkCustomEndDate, setWkCustomEndDate] = useState("");
            const [wkShowWarningOnly, setWkShowWarningOnly] = useState(false);

            // v66: 60일 이내 품절 필터 (30일 필터와 상호 배타적) + 헤더 클릭 정렬 상태
            const [show60WarningOnly, setShow60WarningOnly] = useState(false);
            const [wkShow60WarningOnly, setWkShow60WarningOnly] = useState(false);

            // v67: "60일 이내 품절" 버튼은 분석기준일이 정확히 "30일"일 때만 노출 (다른 기간에서는 일평균 계산 기준이 달라져 혼동을 주므로 숨김)
            useEffect(() => {
                if (!(viewMode === 'period' && selectedPeriod === 30)) setShow60WarningOnly(false);
            }, [viewMode, selectedPeriod]);
            useEffect(() => {
                if (!(wkViewMode === 'period' && wkSelectedPeriod === 30)) setWkShow60WarningOnly(false);
            }, [wkViewMode, wkSelectedPeriod]);
            const [clSortKey, setClSortKey] = useState(null);
            const [clSortDir, setClSortDir] = useState('asc');
            const [wkSortKey, setWkSortKey] = useState(null);
            const [wkSortDir, setWkSortDir] = useState('asc');
            const [totalSortKey, setTotalSortKey] = useState(null);
            const [totalSortDir, setTotalSortDir] = useState('asc');

            // 정렬 헤더 공용 헬퍼: 값이 문자열이면 가나다순, 숫자면 크기순. null/undefined는 항상 맨 뒤로.
            const applySort = (items, key, dir) => {
                if (!key) return items;
                return [...items].sort((a, b) => {
                    const av = a[key], bv = b[key];
                    const aNull = (av === null || av === undefined);
                    const bNull = (bv === null || bv === undefined);
                    if (aNull && bNull) return 0;
                    if (aNull) return 1;
                    if (bNull) return -1;
                    if (typeof av === 'string') {
                        return dir === 'asc' ? av.localeCompare(bv, 'ko', { numeric: true }) : bv.localeCompare(av, 'ko', { numeric: true });
                    }
                    return dir === 'asc' ? av - bv : bv - av;
                });
            };
            const makeSortClick = (key, curKey, curDir, setKey, setDir) => () => {
                if (curKey !== key) { setKey(key); setDir('asc'); }
                else if (curDir === 'asc') { setDir('desc'); }
                else { setKey(null); setDir('asc'); }
            };
            const SortArrow = ({ active, dir }) => (
                <span className={`ml-1 inline-block text-[10px] ${active ? 'text-current' : 'text-slate-300'}`}>{active ? (dir === 'asc' ? '▲' : '▼') : '↕'}</span>
            );

            useEffect(() => {
                const handleOnline = () => setServerStatus("connected");
                const handleOffline = () => setServerStatus("disconnected");
                window.addEventListener("online", handleOnline);
                window.addEventListener("offline", handleOffline);
                return () => {
                    window.removeEventListener("online", handleOnline);
                    window.removeEventListener("offline", handleOffline);
                }
            }, []);

            useEffect(() => {
                if (toastMessage) {
                    const timer = setTimeout(() => setToastMessage(""), 3500);
                    return () => clearTimeout(timer);
                }
            }, [toastMessage]);

            useEffect(() => {
                let isMounted = true;
                const initFirebase = async () => {
                    try {
                        const firebaseConfig = {
                            apiKey: "AIzaSyBoJ8xKhYkr1hyTOJlRaPwGFjVoZIuK9Sw",
                            authDomain: "clstpock.firebaseapp.com",
                            projectId: "clstpock",
                            storageBucket: "clstpock.firebasestorage.app",
                            messagingSenderId: "14396365208",
                            appId: "1:14396365208:web:89625d54c26868e06533ed",
                            measurementId: "G-ZFWM8LBF12"
                        };

                        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                        const { getAuth, signInAnonymously, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                        const { getFirestore, collection, onSnapshot, addDoc, doc, deleteDoc, getDocs } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        const appId = 'inventory-tracker-01'; 

                        if (isMounted) {
                            setFirebaseRefs({ db, appId, collection, onSnapshot, addDoc, doc, deleteDoc, getDocs });
                        }

                        await signInAnonymously(auth);
                        
                        onAuthStateChanged(auth, (user) => {
                            if (isMounted) {
                                setFirebaseUser(user);
                                setServerStatus("connected");
                            }
                        });
                    } catch (err) {
                        console.error("Firebase init error:", err);
                        if (isMounted) setServerStatus("disconnected");
                    }
                };
                initFirebase();
                return () => { isMounted = false; };
            }, []);

            useEffect(() => {
                if (!firebaseUser || !firebaseRefs) return;
                const { db, appId, collection, onSnapshot } = firebaseRefs;
                const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'inventory_history');

                const unsubscribe = onSnapshot(collRef, (snapshot) => {
                    const data = [];
                    snapshot.forEach((doc) => {
                        data.push({ id: doc.id, ...doc.data() });
                    });
                    data.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    setHistories(data);
                    if (data.length > 0) {
                        if (!selectedHistoryId || !data.find(h => h.id === selectedHistoryId)) {
                            setSelectedHistoryId(data[0].id);
                        }
                    } else {
                        setSelectedHistoryId(null);
                    }
                }, (error) => {
                    console.error("Fetch error:", error);
                    setServerStatus("disconnected");
                });
                return () => unsubscribe();
            }, [firebaseUser, selectedHistoryId, firebaseRefs]);

            useEffect(() => {
                if (!firebaseUser || !firebaseRefs) return;
                const { db, appId, collection, onSnapshot } = firebaseRefs;
                const wkCollRef = collection(db, 'artifacts', appId, 'public', 'data', 'weekeep_inventory');

                const unsubscribe = onSnapshot(wkCollRef, (snapshot) => {
                    const data = [];
                    snapshot.forEach((doc) => {
                        data.push({ id: doc.id, ...doc.data() });
                    });
                    data.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    setWkHistories(data);
                    if (data.length > 0) {
                        if (!wkSelectedHistoryId || !data.find(h => h.id === wkSelectedHistoryId)) {
                            setWkSelectedHistoryId(data[0].id);
                        }
                    } else {
                        setWkSelectedHistoryId(null);
                    }
                }, (error) => {
                    console.error("Weekeep Fetch error:", error);
                });
                return () => unsubscribe();
            }, [firebaseUser, wkSelectedHistoryId, firebaseRefs]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (pin === "0501") {
                    setIsAuthenticated(true);
                    localStorage.setItem('inventory_auth_pin', 'true');

            const handleResetDB = async () => {
                if (!firebaseRefs) return;
                const isConfirmed = window.confirm("🚨 경고: 클라우드에 저장된 모든 과거 재고/출고 히스토리를 완전히 삭제하고 초기화합니다.\n정말 초기화 하시겠습니까?");

            const handleResetWeekeepDB = async () => {
                if (!firebaseRefs) return;
                const isConfirmed = window.confirm("🚨 경고: 클라우드에 저장된 위킵(FBW) 재고 이력을 완전히 삭제하고 초기화합니다.\n정말 초기화 하시겠습니까?");
                if (!isConfirmed) return;
                try {
                    const { db, appId, collection, getDocs, deleteDoc } = firebaseRefs;

            const handleCleanDateRange = async () => {
                if (!firebaseRefs || !currentData) return;
                const startStr = window.prompt("삭제할 구간 시작일 (YYYY-MM-DD)\n예: 2026-06-20", "2026-06-20");
                if (!startStr) return;
                const endStr = window.prompt("삭제할 구간 종료일 (YYYY-MM-DD)", startStr);
                if (!endStr) return;
                const [sy, sm, sd] = startStr.split('-');
                const [ey, em, ed] = endStr.split('-');
                const minTime = new Date(sy, sm - 1, sd, 0, 0, 0).getTime();
                const maxTime = new Date(ey, em - 1, ed, 23, 59, 59).getTime();

                if (isNaN(minTime) || isNaN(maxTime) || minTime > maxTime) {
                    alert("날짜 형식이 잘못되었습니다.");
                    return;
                }

                const base = currentData.baseDate;
                const baseD = new Date(base);
                const t30 = new Date(baseD.getFullYear(), baseD.getMonth(), baseD.getDate() - 29, 0, 0, 0).getTime();
                const t15 = new Date(baseD.getFullYear(), baseD.getMonth(), baseD.getDate() - 14, 0, 0, 0).getTime();
                const t7  = new Date(baseD.getFullYear(), baseD.getMonth(), baseD.getDate() - 6,  0, 0, 0).getTime();

                const cleanedItems = currentData.items.map(item => {
                    const daily = { ...(item.daily || {}) };
                    Object.keys(daily).forEach(dKey => {
                        const [y, m, d] = dKey.split('-');
                        const dt = new Date(y, m - 1, d, 12, 0, 0).getTime();
                        if (dt >= minTime && dt <= maxTime) delete daily[dKey];
                    });
                    let s30 = 0, s15 = 0, s7 = 0;
                    Object.entries(daily).forEach(([dKey, amt]) => {
                        const [y, m, d] = dKey.split('-');
                        const dt = new Date(y, m - 1, d, 12, 0, 0).getTime();
                        if (dt >= t30 && dt <= base) s30 += amt;
                        if (dt >= t15 && dt <= base) s15 += amt;
                        if (dt >= t7  && dt <= base) s7  += amt;
                    });
                    return { ...item, daily, out_30: s30, out_15: s15, out_7: s7 };
                });

                try {
                    const { db, appId, collection, addDoc } = firebaseRefs;
                    const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'inventory_history');
                    const newDoc = await addDoc(collRef, {
                        ...currentData,
                        id: undefined,
                        createdAt: new Date().toISOString(),
                        version: `V${histories.length + 1}_cleaned`,
                        items: cleanedItems
                    });
                    setSelectedHistoryId(newDoc.id);
                    setToastMessage(`✅ ${startStr} ~ ${endStr} 구간 ghost 제거 완료`);
                } catch (err) {
                    console.error(err);
                    alert("저장 실패: " + err.message);
                }
            };

            // v54: 타임존 시차 오차를 원천 봉쇄하는 하드코어 UTC 파싱 (절대 삭제/수정 금지)
            const parseExcelDate = (val) => {
                if (!val) return null;
                if (val instanceof Date) {
                    return new Date(val.getUTCFullYear(), val.getUTCMonth(), val.getUTCDate(), val.getUTCHours(), val.getUTCMinutes(), val.getUTCSeconds());
                }
                if (typeof val === 'number') {
                    const utcMs = Math.round((val - 25569) * 86400 * 1000);
                    const d = new Date(utcMs);
                    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds());
                }
                const str = String(val).trim().replace(/\./g, '-').replace(/\//g, '-').replace(" ", "T");
                const d = new Date(str);
                if (!isNaN(d.getTime())) return d;
                return null;
            };

            // v54: 메가 업로드 엔진 (CL 2개 + 위킵 1개 한방에 처리)
            const handleUnifiedFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                setIsUploading(true);

                try {
                    let wkItemsMap = new Map();
                    let isWeekeepFile = false;

                    let rawStock = [];
                    let rawOutbound = [];
                    let isStockFile = false;
                    let isOutboundFile = false;
                    let hasParsedStockHeader = false;
                    let hasParsedOutboundHeader = false;

                    const fileReads = files.map(file => {
                        return new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = (evt) => resolve({ file, data: evt.target.result });
                            reader.onerror = reject;
                            reader.readAsBinaryString(file);
                        });
                    });

                    const results = await Promise.all(fileReads);

                    for (const result of results) {
                        const { file, data: fileString } = result;
                        let wb;
                        
                        if (fileString.includes('<table') || fileString.includes('<TABLE') || fileString.includes('<?xml')) {
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(fileString, 'text/html');
                            const table = doc.querySelector('table');
                            if (!table) throw new Error(`[${file.name}] 표(Table)를 찾을 수 없습니다.`);
                            wb = XLSX.utils.table_to_book(table, { raw: true, cellDates: true });
                        } else {
                            wb = XLSX.read(fileString, { type: 'binary', cellDates: true });
                        }

                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const sheetData = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
                        const headerRow = sheetData[0] || [];
                        
                        const hasWkKw = headerRow.some(k => typeof k === 'string' && (k.includes('유보재고') || k.includes('하자재고')));
                        const hasStockKw = headerRow.some(k => typeof k === 'string' && (k.includes('현재고') || k.includes('가용재고') || k.includes('안전재고'))) && !hasWkKw;
                        const hasOutboundKw = headerRow.some(k => typeof k === 'string' && (k.includes('출고일시') || k.includes('출고량') || k.includes('주문일')));

                        if (hasWkKw) {
                            isWeekeepFile = true;
                            const findIdx = (kws, fb) => {
                                for(const k of kws) { const idx = headerRow.findIndex(col => String(col).trim() === k); if(idx !== -1) return idx; }
                                for(const k of kws) { const idx = headerRow.findIndex(col => String(col).trim().includes(k)); if(idx !== -1) return idx; }
                                return fb;
                            };
                            const nameIdx = findIdx(['상품명'], 1);
                            const availIdx = findIdx(['가용재고'], 9);
                            const safeIdx = findIdx(['안전재고'], 10);
                            const reservedIdx = findIdx(['유보재고'], 11);
                            const defectiveIdx = findIdx(['하자재고'], 12);
                            const monthlyOutIdx = findIdx(['월평균출고량'], 7); // v56 누락 컬럼 추가
                            const dailyOutIdx = findIdx(['일평균출고량'], 8); // v56 누락 컬럼 추가

                            sheetData.forEach((row, idx) => {
                                if (idx === 0 || !row || row.length === 0) return;
                                const itemName = String(row[nameIdx] || '').trim();
                                if (!itemName || itemName === '상품명') return;
                                const toNum = (v) => parseFloat(String(v || '0').replace(/,/g, '')) || 0;
                                wkItemsMap.set(itemName, {
                                    itemName, 
                                    stock: toNum(row[availIdx]), 
                                    safeStock: toNum(row[safeIdx]), 
                                    reservedStock: toNum(row[reservedIdx]), 
                                    defectiveStock: toNum(row[defectiveIdx]),
                                    avgMonthlyOut: toNum(row[monthlyOutIdx]), 
                                    avgDailyOut: toNum(row[dailyOutIdx])
                                });
                            });
                        } else if (wb.SheetNames.length >= 2 && !file.name.toLowerCase().includes('.csv')) {
                            isStockFile = true; isOutboundFile = true;
                            const sData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
                            const oData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[1]], { header: 1, raw: true, defval: '' });
                            rawStock = hasParsedStockHeader ? rawStock.concat(sData.slice(1)) : sData;
                            rawOutbound = hasParsedOutboundHeader ? rawOutbound.concat(oData.slice(1)) : oData;
                            hasParsedStockHeader = true; hasParsedOutboundHeader = true;
                        } else {
                            if (hasStockKw) {
                                isStockFile = true;
                                rawStock = hasParsedStockHeader ? rawStock.concat(sheetData.slice(1)) : sheetData;
                                hasParsedStockHeader = true;
                            } else if (hasOutboundKw) {
                                isOutboundFile = true;
                                rawOutbound = hasParsedOutboundHeader ? rawOutbound.concat(sheetData.slice(1)) : sheetData;
                                hasParsedOutboundHeader = true;
                            } else {
                                throw new Error(`[${file.name}] 알 수 없는 형식의 파일입니다.`);
                            }
                        }
                    }

                    let msgArr = [];

                    // 1. 위킵 업로드 처리
                    if (isWeekeepFile) {
                        const finalWkItems = Array.from(wkItemsMap.values());
                        if (finalWkItems.length > 0) {
                            const newDocData = { version: `V${wkHistories.length + 1}`, createdAt: new Date().toISOString(), items: finalWkItems };
                            const { db, appId, collection, addDoc } = firebaseRefs;
                            const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'weekeep_inventory');
                            const newDoc = await addDoc(collRef, newDocData);
                            setWkSelectedHistoryId(newDoc.id);
                            msgArr.push("위킵 재고");
                        }
                    }

                    // 2. CL 시스템 업로드 처리
                    if (isStockFile || isOutboundFile) {
                        let latestHistory = histories.length > 0 ? histories[0] : null;
                        const findIdxPriority = (header, keywords, fallback) => {
                            for (const k of keywords) { const idx = header.findIndex(col => String(col).trim() === k); if (idx !== -1) return idx; }
                            for (const k of keywords) { const idx = header.findIndex(col => String(col).trim().includes(k)); if (idx !== -1) return idx; }
                            return fallback;
                        };

                        const outboundMap = {};
                        let globalMaxDateObj = new Date(0);
                        let baseTime = latestHistory ? latestHistory.baseDate : new Date().getTime();
                        let minUploadTimeMs = Infinity; let maxUploadTimeMs = 0;

                        if (isOutboundFile) {
                            let header2 = rawOutbound[0] || [];
                            const h2DateIdx = findIdxPriority(header2, ['출고일시', '주문일'], 6);
                            const h2NameIdx = findIdxPriority(header2, ['자사 상품명', '상품명'], 7);
                            const h2QtyIdx = findIdxPriority(header2, ['출고량', '출고수량', '수량'], 8);

                            // 완벽한 중복 방어 엔진
                            const seenRows = new Set();
                            const validOutboundRows = [];

                            rawOutbound.forEach((row, idx) => {
                                if (idx === 0) { validOutboundRows.push(row); return; }
                                if (!row || row.length === 0) return;
                                const uniqueKey = row.map(cell => {
                                    if (cell == null) return '';
                                    if (cell instanceof Date) return cell.getTime();
                                    return String(cell).trim();
                                }).join("|");

                                if (!seenRows.has(uniqueKey)) {
                                    seenRows.add(uniqueKey);
                                    validOutboundRows.push(row);
                                }
                            });
                            rawOutbound = validOutboundRows;

                            rawOutbound.forEach((row, idx) => {
                                if (idx === 0 || !row || row.length === 0) return;
                                const d = parseExcelDate(row[h2DateIdx]);
                                if (d && !isNaN(d.getTime())) {
                                    const ms = d.getTime();
                                    if (ms < minUploadTimeMs) minUploadTimeMs = ms;
                                    if (ms > maxUploadTimeMs) maxUploadTimeMs = ms;
                                    if (ms > globalMaxDateObj.getTime()) globalMaxDateObj = d;
                                }
                            });
                            if (globalMaxDateObj.getTime() > 0) {
                                const baseDateObj = new Date(globalMaxDateObj.getFullYear(), globalMaxDateObj.getMonth(), globalMaxDateObj.getDate(), 23, 59, 59, 999);
                                baseTime = baseDateObj.getTime();
                            }
                        }

                        if (latestHistory) {
                            latestHistory.items.forEach(item => {
                                const preservedDaily = { ...(item.daily || {}) };
                                if (isOutboundFile && minUploadTimeMs <= maxUploadTimeMs) {
                                    const minD = new Date(minUploadTimeMs); const maxD = new Date(maxUploadTimeMs);
                                    const minTime = new Date(minD.getFullYear(), minD.getMonth(), minD.getDate(), 0, 0, 0).getTime();
                                    const maxTime = new Date(maxD.getFullYear(), maxD.getMonth(), maxD.getDate(), 23, 59, 59).getTime();
                                    Object.keys(preservedDaily).forEach(dKey => {
                                        const [y, m, dStr] = dKey.split('-');
                                        const keyTime = new Date(y, m - 1, dStr, 12, 0, 0).getTime();
                                        if (keyTime >= minTime && keyTime <= maxTime) delete preservedDaily[dKey]; 
                                    });
                                }
                                outboundMap[item.itemName] = { out_30: 0, out_15: 0, out_7: 0, daily: preservedDaily };
                            });
                        }

                        if (isOutboundFile) {
                            let header2 = rawOutbound[0] || [];
                            const h2DateIdx = findIdxPriority(header2, ['출고일시', '주문일'], 6);
                            const h2NameIdx = findIdxPriority(header2, ['자사 상품명', '상품명'], 7);
                            const h2QtyIdx = findIdxPriority(header2, ['출고량', '출고수량', '수량'], 8);
                            const baseDateForRange = new Date(baseTime);
                            const time30 = new Date(baseDateForRange.getFullYear(), baseDateForRange.getMonth(), baseDateForRange.getDate() - 29, 0, 0, 0, 0).getTime();
                            const time15 = new Date(baseDateForRange.getFullYear(), baseDateForRange.getMonth(), baseDateForRange.getDate() - 14, 0, 0, 0, 0).getTime();
                            const time7 = new Date(baseDateForRange.getFullYear(), baseDateForRange.getMonth(), baseDateForRange.getDate() - 6, 0, 0, 0, 0).getTime();

                            rawOutbound.forEach((row, idx) => {
                                if (idx === 0 || !row || row.length === 0) return;
                                const itemName = String(row[h2NameIdx] || '').trim();
                                const amtStr = String(row[h2QtyIdx] || "0").replace(/,/g, '');
                                const amt = parseFloat(amtStr) || 0;
                                if (!itemName) return;
                                const d = parseExcelDate(row[h2DateIdx]);
                                if (!d || isNaN(d.getTime())) return;
                                
                                if (!outboundMap[itemName]) outboundMap[itemName] = { out_30: 0, out_15: 0, out_7: 0, daily: {} };
                                const dKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                                outboundMap[itemName].daily[dKey] = (outboundMap[itemName].daily[dKey] || 0) + amt;
                            });

                            Object.keys(outboundMap).forEach(itemName => {
                                let sum30 = 0, sum15 = 0, sum7 = 0;
                                Object.entries(outboundMap[itemName].daily).forEach(([dStr, amt]) => {
                                    if (!dStr.includes('-')) return;
                                    const [y, m, d] = dStr.split('-');
                                    const dt = new Date(y, m - 1, d, 12, 0, 0).getTime();
                                    if (dt >= time30 && dt <= baseTime) sum30 += amt;
                                    if (dt >= time15 && dt <= baseTime) sum15 += amt;
                                    if (dt >= time7 && dt <= baseTime) sum7 += amt;
                                });
                                outboundMap[itemName].out_30 = sum30; outboundMap[itemName].out_15 = sum15; outboundMap[itemName].out_7 = sum7;
                            });
                        }

                        const parsedItemsMap = new Map();
                        if (latestHistory) latestHistory.items.forEach(item => parsedItemsMap.set(item.itemName, { ...item }));

                        if (isStockFile) {
                            const header1 = rawStock[0] || [];
                            const h1NameIdx = findIdxPriority(header1, ['자사 상품명', '상품명'], 4);
                            const h1StockIdx = findIdxPriority(header1, ['가용재고', '현재고', '총재고'], 5); 
                            const h1ActualStockIdx = findIdxPriority(header1, ['현재고'], -1);
                            const h1SafeStockIdx = findIdxPriority(header1, ['안전재고'], 9); 
                            rawStock.forEach((row, idx) => {
                                if (idx === 0 || !row) return; 
                                const itemName = String(row[h1NameIdx] || '').trim(); 
                                const stockStr = String(row[h1StockIdx] || "0").replace(/,/g, '');
                                let stock = parseFloat(stockStr) || 0; 
                                const safeStockStr = String(row[h1SafeStockIdx] || "0").replace(/,/g, '');
                                const safeStock = parseFloat(safeStockStr) || 0;
                                if (!itemName || itemName === '상품명' || itemName === '자사 상품명') return;

                                // v59: 위킵 이관 중인 품목 예외 처리 — 가용재고가 0인데 현재고가 마이너스면(이관 처리 지연분)
                                // 총재고 표시값을 가용재고(0) 대신 실제 현재고(마이너스)로 사용
                                let actualStock = null;
                                if (h1ActualStockIdx !== -1) {
                                    const actualStockStr = String(row[h1ActualStockIdx] || "0").replace(/,/g, '');
                                    actualStock = parseFloat(actualStockStr) || 0;
                                }
                                if (stock === 0 && actualStock !== null && actualStock < 0) {
                                    stock = actualStock;
                                }
                                
                                const existing = parsedItemsMap.get(itemName) || {};
                                parsedItemsMap.set(itemName, { ...existing, itemName, stock, safeStock });
                            });
                        }

                        const finalItems = Array.from(parsedItemsMap.values()).map(item => {
                            const outData = outboundMap[item.itemName] || { out_30: 0, out_15: 0, out_7: 0, daily: {} };
                            return { ...item, out_30: outData.out_30, out_15: outData.out_15, out_7: outData.out_7, daily: outData.daily };
                        });

                        const newDocData = { version: `V${histories.length + 1}`, createdAt: new Date().toISOString(), baseDate: baseTime, items: finalItems };
                        const { db, appId, collection, addDoc } = firebaseRefs;
                        const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'inventory_history');
                        const newDoc = await addDoc(collRef, newDocData);
                        setSelectedHistoryId(newDoc.id);
                        msgArr.push("CL 시스템");
                    }

                    if (msgArr.length > 0) {
                        setToastMessage(`✅ 통합 파일 분석 완료: [${msgArr.join(', ')}] DB가 최신화되었습니다.`);
                    } else {
                        alert("분석 가능한 유효한 재고/출고 데이터를 찾지 못했습니다.");
                    }

                } catch (error) {
                    console.error("Unified Upload Error:", error);
                    alert(`❌ 엑셀 분석 실패\n\n(상세에러: ${error.message})`);
                } finally {
                    setIsUploading(false);
                    e.target.value = null;
                }
            };

            const formatDate = (isoString) => {
                const d = new Date(isoString);
                return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            };
            const getFileNameDate = (isoString) => {
                const d = new Date(isoString);
                return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
            };

            const currentData = useMemo(() => histories.find(h => h.id === selectedHistoryId) || null, [histories, selectedHistoryId]);
            const wkCurrentData = useMemo(() => wkHistories.find(h => h.id === wkSelectedHistoryId) || null, [wkHistories, wkSelectedHistoryId]);

            // v58: 위킵 스냅샷 간 가용재고 증감 비교로 "일자별" 출고수량 맵 산출 (CL의 item.daily와 동일한 구조)
            // 로직: 이전 스냅샷 대비 재고가 "감소"한 만큼 = 출고(해당 스냅샷 업로드일에 귀속), "증가"한 만큼 = 입고/이관(0으로 처리, 음수 출고 방지)
            // 최초 시점재고(7/23) 이후 업로드된 스냅샷들을 순서대로 비교하여 선택된 시점까지의 일자별 출고 데이터를 누적
            const wkDailyOutboundMap = useMemo(() => {
                if (!wkCurrentData || wkHistories.length === 0) return {};
                const sortedAsc = [...wkHistories].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
                const selectedIdx = sortedAsc.findIndex(h => h.id === wkSelectedHistoryId);
                if (selectedIdx <= 0) return {}; // 최초 시점재고(기준) 자체는 출고량 없음

                const dailyMap = {}; // itemName -> { 'YYYY-MM-DD': qty }
                for (let i = 1; i <= selectedIdx; i++) {
                    const prevMap = new Map((sortedAsc[i - 1].items || []).map(it => [it.itemName, it.stock || 0]));
                    const snapDate = new Date(sortedAsc[i].createdAt);
                    const dateKey = `${snapDate.getFullYear()}-${String(snapDate.getMonth() + 1).padStart(2, '0')}-${String(snapDate.getDate()).padStart(2, '0')}`;
                    (sortedAsc[i].items || []).forEach(it => {
                        if (!prevMap.has(it.itemName)) return; // 신규 등록 품목은 비교 기준이 없어 스킵
                        const prevStock = prevMap.get(it.itemName);
                        const currStock = it.stock || 0;
                        const delta = prevStock - currStock;
                        if (delta > 0) {
                            if (!dailyMap[it.itemName]) dailyMap[it.itemName] = {};
                            dailyMap[it.itemName][dateKey] = (dailyMap[it.itemName][dateKey] || 0) + delta;
                        }
                        // delta <= 0 (재고 증가)인 구간은 입고/이관으로 간주하여 출고수량에 반영하지 않음
                    });
                }
                return dailyMap;
            }, [wkHistories, wkSelectedHistoryId, wkCurrentData]);

            useEffect(() => {
                if (wkCurrentData && wkCurrentData.createdAt) {
                    const end = new Date(wkCurrentData.createdAt);
                    const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                    setWkCustomEndDate(fmt(end)); setWkCustomStartDate(fmt(end));
                }
            }, [wkCurrentData]);

            const wkDisplayDateRange = useMemo(() => {
                if (!wkCurrentData || !wkCurrentData.createdAt) return "";
                if (wkViewMode === 'period') {
                    const end = new Date(wkCurrentData.createdAt);
                    const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - (wkSelectedPeriod - 1));
                    return `${start.getMonth()+1}/${start.getDate()} ~ ${end.getMonth()+1}/${end.getDate()}`;
                } else {
                    if (!wkCustomStartDate || !wkCustomEndDate) return "날짜를 선택해주세요";
                    const start = new Date(wkCustomStartDate); const end = new Date(wkCustomEndDate);
                    if (start.getTime() === end.getTime()) return `${start.getMonth()+1}/${start.getDate()}`;
                    const minDate = start < end ? start : end; const maxDate = start > end ? start : end;
                    return `${minDate.getMonth()+1}/${minDate.getDate()} ~ ${maxDate.getMonth()+1}/${maxDate.getDate()}`;
                }
            }, [wkCurrentData, wkSelectedPeriod, wkViewMode, wkCustomStartDate, wkCustomEndDate]);

            useEffect(() => {
                if (currentData && currentData.baseDate) {
                    const end = new Date(currentData.baseDate);
                    const fmt = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                    setCustomEndDate(fmt(end)); setCustomStartDate(fmt(end));
                }
            }, [currentData]);

            const displayDateRange = useMemo(() => {
                if (!currentData || !currentData.baseDate) return "";
                if (viewMode === 'period') {
                    const end = new Date(currentData.baseDate);
                    const start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - (selectedPeriod - 1));
                    return `${start.getMonth()+1}/${start.getDate()} ~ ${end.getMonth()+1}/${end.getDate()}`;
                } else {
                    if (!customStartDate || !customEndDate) return "날짜를 선택해주세요";
                    const start = new Date(customStartDate); const end = new Date(customEndDate);
                    if (start.getTime() === end.getTime()) return `${start.getMonth()+1}/${start.getDate()}`;
                    const minDate = start < end ? start : end; const maxDate = start > end ? start : end;
                    return `${minDate.getMonth()+1}/${minDate.getDate()} ~ ${maxDate.getMonth()+1}/${maxDate.getDate()}`;
                }
            }, [currentData, selectedPeriod, viewMode, customStartDate, customEndDate]);

            // v68: 버그 수정 — 기존에는 이 배열 자체가 30일/60일 품절 필터로 걸러진 뒤 총재고 탭의 데이터 소스로도 재사용되고 있었음.
            // 그 결과 총재고 탭에서 필터를 켜면 "CL재고=0(위킵으로 이관 완료)"인 품목이 이 단계에서 이미 걸러져 사라지고,
            // 총재고 탭이 그 위에 다시 (합산 기준) 필터를 적용하면서 이중 필터링되어 대부분의 품목이 통째로 빠지는 문제가 있었음.
            // → 계산만 하는 processedItemsBase(필터 없음)와, CL 탭 전용 표시용 processedItems(검색+품절 필터 적용)를 분리.
            const processedItemsBase = useMemo(() => {
                if (!currentData) return [];
                let sTime = 0, eTime = 0;
                if (viewMode === 'custom' && customStartDate && customEndDate) {
                    const parseSafe = (dStr, isEnd) => {
                        const [y, m, d] = dStr.split('-');
                        return isEnd ? new Date(y, m - 1, d, 23, 59, 59, 999).getTime() : new Date(y, m - 1, d, 0, 0, 0, 0).getTime();
                    };
                    sTime = parseSafe(customStartDate, false); eTime = parseSafe(customEndDate, true);
                    if (sTime > eTime) { const temp = sTime; sTime = eTime; eTime = temp; }
                }

                return currentData.items.map(item => {
                    let outbound = 0; let periodToUse = 30;
                    if (viewMode === 'period') {
                        periodToUse = selectedPeriod;
                        if (currentData.baseDate && item.daily) {
                            const baseD = new Date(currentData.baseDate);
                            const startT = new Date(baseD.getFullYear(), baseD.getMonth(), baseD.getDate() - (selectedPeriod - 1), 0, 0, 0, 0).getTime();
                            const endT = new Date(baseD.getFullYear(), baseD.getMonth(), baseD.getDate(), 23, 59, 59, 999).getTime();
                            let sum = 0;
                            Object.entries(item.daily).forEach(([dStr, amt]) => {
                                if (!dStr.includes('-')) return;
                                const [y, m, d] = dStr.split('-');
                                const dt = new Date(y, m - 1, d, 12, 0, 0).getTime();
                                if (dt >= startT && dt <= endT) sum += amt;
                            });
                            outbound = sum;
                        } else {
                            // v66: item.daily가 없는 레거시 데이터는 사전 계산된 out_30/15/7 필드로 폴백 (60일 등 신규 구간은 daily 기반으로만 계산됨)
                            outbound = item[`out_${selectedPeriod}`] || 0;
                        }
                    } else if (viewMode === 'custom') {
                        if (sTime > 0 && eTime > 0 && item.daily) {
                            let sum = 0;
                            Object.entries(item.daily).forEach(([dStr, amt]) => {
                                if (!dStr.includes('-')) return;
                                const [y, m, d] = dStr.split('-');
                                const dt = new Date(y, m - 1, d, 12, 0, 0).getTime();
                                if (dt >= sTime && dt <= eTime) sum += amt;
                            });
                            outbound = sum;
                            periodToUse = Math.max(1, Math.ceil((eTime - sTime) / 86400000));
                        }
                    }
                    
                    const daily = outbound / periodToUse;
                    let availableDays = null;
                    if (daily > 0) availableDays = Math.max(0, Math.floor(item.stock / daily));

                    let mainGroup = null; let displayName = item.itemName; 
                    const match = item.itemName.match(/^(\d+)/);
                    if (match) mainGroup = match[1]; 
                    
                    return {
                        ...item, safeStock: item.safeStock || 0, _outboundToDisplay: outbound, _dailyToDisplay: daily,
                        _availableDays: availableDays, _periodToUse: periodToUse, _mainGroup: mainGroup, _displayName: displayName
                    };
                }).filter(item => !!item._mainGroup);
            }, [currentData, selectedPeriod, viewMode, customStartDate, customEndDate]);

            // CL 탭 전용 표시 목록: base에 검색어 + 30일/60일 품절 필터를 적용 (총재고 탭 데이터 소스로는 절대 재사용하지 않음)
            const processedItems = useMemo(() => {
                return processedItemsBase.filter(item => {
                    if (searchKeyword && !item._displayName.toLowerCase().includes(searchKeyword.toLowerCase())) return false;
                    if (showWarningOnly) return item._availableDays !== null && item._availableDays < 30 && item.stock > 0;
                    if (show60WarningOnly) return item._availableDays !== null && item._availableDays < 60 && item.stock > 0;
                    return true;
                });
            }, [processedItemsBase, showWarningOnly, show60WarningOnly, searchKeyword]);

            const sortedProcessedItems = useMemo(() => applySort(processedItems, clSortKey, clSortDir), [processedItems, clSortKey, clSortDir]);

            const wkProcessedItems = useMemo(() => {
                if (!wkCurrentData) return [];
                let sTime = 0, eTime = 0;
                if (wkViewMode === 'custom' && wkCustomStartDate && wkCustomEndDate) {
                    const parseSafe = (dStr, isEnd) => {
                        const [y, m, d] = dStr.split('-');
                        return isEnd ? new Date(y, m - 1, d, 23, 59, 59, 999).getTime() : new Date(y, m - 1, d, 0, 0, 0, 0).getTime();
                    };
                    sTime = parseSafe(wkCustomStartDate, false); eTime = parseSafe(wkCustomEndDate, true);
                    if (sTime > eTime) { const temp = sTime; sTime = eTime; eTime = temp; }
                }

                let items = wkCurrentData.items.map(item => {
                    const dailyMap = wkDailyOutboundMap[item.itemName] || {};
                    const totalOutboundQty = Object.values(dailyMap).reduce((s, v) => s + v, 0);

                    let outbound = 0; let periodToUse = wkSelectedPeriod || 30;
                    if (wkViewMode === 'period' && wkCurrentData.createdAt) {
                        const end = new Date(wkCurrentData.createdAt);
                        const startT = new Date(end.getFullYear(), end.getMonth(), end.getDate() - (wkSelectedPeriod - 1), 0, 0, 0, 0).getTime();
                        const endT = new Date(end.getFullYear(), end.getMonth(), end.getDate(), 23, 59, 59, 999).getTime();
                        Object.entries(dailyMap).forEach(([dStr, amt]) => {
                            const [y, m, d] = dStr.split('-');
                            const dt = new Date(y, m - 1, d, 12, 0, 0).getTime();
                            if (dt >= startT && dt <= endT) outbound += amt;
                        });
                        periodToUse = wkSelectedPeriod;
                    } else if (wkViewMode === 'custom') {
                        if (sTime > 0 && eTime > 0) {
                            Object.entries(dailyMap).forEach(([dStr, amt]) => {
                                const [y, m, d] = dStr.split('-');
                                const dt = new Date(y, m - 1, d, 12, 0, 0).getTime();
                                if (dt >= sTime && dt <= eTime) outbound += amt;
                            });
                            periodToUse = Math.max(1, Math.ceil((eTime - sTime) / 86400000));
                        }
                    }

                    const daily = outbound / periodToUse;
                    let availableDays = null;
                    if (daily > 0) availableDays = Math.max(0, Math.floor((item.stock || 0) / daily));

                    return { ...item, _outboundQty: totalOutboundQty, _outboundToDisplay: outbound, _dailyToDisplay: daily, _availableDays: availableDays };
                });

                if (wkSearchKeyword) items = items.filter(i => i.itemName.toLowerCase().includes(wkSearchKeyword.toLowerCase()));
                if (wkShowWarningOnly) items = items.filter(i => i._availableDays !== null && i._availableDays < 30 && (i.stock || 0) > 0);
                if (wkShow60WarningOnly) items = items.filter(i => i._availableDays !== null && i._availableDays < 60 && (i.stock || 0) > 0);
                if (wkSortKey) {
                    items = applySort(items, wkSortKey, wkSortDir);
                } else {
                    items.sort((a, b) => a.itemName.localeCompare(b.itemName, 'ko', { numeric: true }));
                }
                return items;
            }, [wkCurrentData, wkSearchKeyword, wkDailyOutboundMap, wkViewMode, wkSelectedPeriod, wkCustomStartDate, wkCustomEndDate, wkShowWarningOnly, wkShow60WarningOnly, wkSortKey, wkSortDir]);

            // v54: CL + 위킵 데이터 통합 계산 엔진 (총재고 탭 리스트용)
            const combinedItems = useMemo(() => {
                const map = new Map();
                if (processedItemsBase) {
                    processedItemsBase.forEach(item => {
                        if (!item.itemName || !item.itemName.match(/^(\d+)/)) return;
                        map.set(item.itemName, {
                            ...item,
                            clStock: item.stock || 0,
                            wkStock: 0,
                            inCl: true,
                            inWk: false
                        });
                    });
                }

                if (wkCurrentData) {
                    wkCurrentData.items.forEach(wkItem => {
                        if (!wkItem.itemName || !wkItem.itemName.match(/^(\d+)/)) return;
                        const existing = map.get(wkItem.itemName);
                        if (existing) {
                            existing.wkStock = wkItem.stock || 0;
                            existing.inWk = true;
                        } else {
                            map.set(wkItem.itemName, {
                                itemName: wkItem.itemName,
                                _displayName: wkItem.itemName,
                                clStock: 0,
                                wkStock: wkItem.stock || 0,
                                safeStock: wkItem.safeStock || 0,
                                _outboundToDisplay: 0,
                                _dailyToDisplay: 0,
                                _availableDays: null,
                                inCl: false,
                                inWk: true
                            });
                        }
                    });
                }

                let items = Array.from(map.values()).map(i => {
                    const totalStock = i.clStock + i.wkStock;
                    let availableDays = null;
                    if (i._dailyToDisplay > 0) {
                        availableDays = Math.max(0, Math.floor(totalStock / i._dailyToDisplay));
                    }
                    return { ...i, total: totalStock, _combinedAvailableDays: availableDays };
                });

                if (totalSearchKeyword) items = items.filter(i => i._displayName.toLowerCase().includes(totalSearchKeyword.toLowerCase()));
                if (showWarningOnly) items = items.filter(i => i._combinedAvailableDays !== null && i._combinedAvailableDays < 30 && i.total > 0);
                if (show60WarningOnly) items = items.filter(i => i._combinedAvailableDays !== null && i._combinedAvailableDays < 60 && i.total > 0);

                if (totalSortKey) {
                    items = applySort(items, totalSortKey, totalSortDir);
                } else {
                    items.sort((a, b) => a.itemName.localeCompare(b.itemName, 'ko', { numeric: true }));
                }
                return items;
            }, [processedItemsBase, wkCurrentData, totalSearchKeyword, showWarningOnly, show60WarningOnly, totalSortKey, totalSortDir]);

            const combinedSummary = useMemo(() => {
                const all = combinedItems;
                const clTotal = all.reduce((sum, i) => sum + i.clStock, 0);
                const wkTotal = all.reduce((sum, i) => sum + i.wkStock, 0);
                const grandTotal = clTotal + wkTotal;
                const migrationRate = grandTotal > 0 ? (wkTotal / grandTotal * 100) : 0;
                const unmatchedCount = all.filter(i => !(i.inCl && i.inWk) && i.total > 0).length;
                return { clTotal, wkTotal, grandTotal, migrationRate, unmatchedCount, itemCount: all.length };
            }, [combinedItems]);

            const exportToExcel = () => {
                const sourceData = activeTab === 'total' ? combinedItems : (activeTab === 'weekeep' ? wkProcessedItems : processedItems);
                if (!sourceData || sourceData.length === 0) {
                    alert("다운로드할 데이터가 없습니다.");
                    return;
                }

                let dynamicColName = viewMode === 'period' ? `출고수량(${selectedPeriod}일)` : `출고수량(${displayDateRange})`;
                let wkDynamicColName = wkViewMode === 'period' ? `출고수량(${wkSelectedPeriod}일)` : `출고수량(${wkDisplayDateRange})`;

                const exportData = sourceData.map(item => {
                    if (activeTab === 'total') {
                        return {
                            "상품명": item._displayName,
                            "합계(총재고)": item.total,
                            "CL 재고": item.clStock,
                            "위킵 재고": item.wkStock,
                            "안전재고": item.safeStock || 0,
                            [dynamicColName]: item._outboundToDisplay,
                            "일평균": item._outboundToDisplay > 0 ? item._dailyToDisplay.toFixed(1) : "-",
                            "예상 소진일(일)": item._combinedAvailableDays === null ? "출고 없음" : item._combinedAvailableDays,
                            "상태": (item.inCl && item.inWk) ? "양쪽 등록" : (item.inCl ? "CL만" : "위킵만")
                        };
                    } else if (activeTab === 'weekeep') {
                        return {
                            "상품명": item.itemName,
                            "가용재고(위킵)": item.stock,
                            "안전재고": item.safeStock || 0,
                            [wkDynamicColName]: item._outboundToDisplay || 0,
                            "일평균": item._outboundToDisplay > 0 ? item._dailyToDisplay.toFixed(1) : "-",
                            "예상 소진일(일)": item._availableDays === null ? "출고 없음" : item._availableDays,
                            "출고수량(전체 누적)": item._outboundQty || 0,
                            "유보재고": item.reservedStock,
                            "하자재고": item.defectiveStock,
                            "월평균출고(원본)": item.avgMonthlyOut,
                            "일평균출고(원본)": item.avgDailyOut
                        };
                    } else {
                        return {
                            "상품명": item._displayName,
                            "총재고": item.stock,
                            "안전재고": item.safeStock || 0,
                            [dynamicColName]: item._outboundToDisplay,
                            "일평균": item._outboundToDisplay > 0 ? item._dailyToDisplay.toFixed(1) : "-",
                            "예상 소진일(일)": item._availableDays === null ? "출고 없음" : item._availableDays
                        };
                    }
                });

                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "재고소진예상일");
                let rangeStr = viewMode === 'period' ? `${selectedPeriod}일` : '지정일';
                let tabName = activeTab === 'total' ? '총재고' : (activeTab === 'weekeep' ? '위킵재고' : 'CL재고');
                XLSX.writeFile(workbook, `요미몬재고분석_${tabName}_${rangeStr}_${getFileNameDate(new Date().toISOString())}.xlsx`);
            };

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-10 border border-slate-200">
                            <div className="text-center mb-8">
                                <div className="bg-indigo-100 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                    <svg className="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                                </div>
                                <h2 className="text-2xl font-bold text-slate-800">보안 접근</h2>
                                <p className="text-sm text-slate-500 mt-2">관리자 권한이 필요합니다.</p>
                            </div>
                            <form onSubmit={handleLogin}>
                                <input 
                                    type="password" 
                                    value={pin}
                                    onChange={(e) => setPin(e.target.value)}
                                    placeholder="비밀번호 입력"
                                    className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center text-lg tracking-widest font-semibold text-slate-700 mb-4"
                                    autoFocus
                                />
                                {errorMsg && <p className="text-red-500 text-sm text-center mb-4">{errorMsg}</p>}
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition-colors shadow-md">
                                    접속하기
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 relative">
                    
                    {toastMessage && (
                        <div className="fixed inset-0 z-50 flex justify-center items-start pt-6" onClick={() => setToastMessage("")}>
                            <div className="bg-white border border-slate-200 shadow-xl rounded-2xl p-4 flex items-center gap-4 animate-slide-down max-w-sm w-full mx-4 cursor-default" onClick={(e) => e.stopPropagation()}>
                                <div className="bg-green-100 text-green-600 rounded-full p-2.5 flex-shrink-0">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <div className="flex-grow">
                                    <h4 className="text-sm font-bold text-slate-800">시스템 알림</h4>
                                    <p className="text-xs text-slate-500 mt-0.5">{toastMessage}</p>
                                </div>
                                <button onClick={() => setToastMessage("")} className="text-slate-400 hover:text-slate-600 p-1 flex-shrink-0">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                        </div>
                    )}

                    <header className="glass-effect relative z-30 border-b border-slate-200 px-6 py-4 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                        <div className="flex flex-col sm:flex-row sm:items-center gap-3">
